<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HYUNIL VIDEO</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-color: #ffffff;
        --panel-bg: #f8f9fa;
        --panel-bg-high: #eeeeee;
        --text-color: #131313;
        --sub-text: #606368;
        --border-color: #e5e5e5;
        --accent: #ff0000;
        --link-color: #4285F4;
        --glass-bg: rgba(255,255,255,0.75);
        --radius-thumb: 1rem;
        --radius-pill: 9999px;
    }
    [data-theme="dark"] {
        --bg-color: #131313;
        --panel-bg: #1c1b1b;
        --panel-bg-high: #2a2a2a;
        --text-color: #e5e2e1;
        --sub-text: #a8a5a4;
        --border-color: #262626;
        --accent: #ff4d4d;
        --link-color: #8ab4f8;
        --glass-bg: rgba(28,27,27,0.75);
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: 'Inter', 'Malgun Gothic', sans-serif;
        background: var(--bg-color);
        color: var(--text-color);
        letter-spacing: -0.01em;
    }
    header {
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 14px 28px;
        border-bottom: 1px solid var(--border-color);
        position: sticky;
        top: 0;
        z-index: 100;
        background: var(--bg-color);
    }
    .home-link {
        display: flex;
        align-items: center;
        text-decoration: none;
        color: var(--text-color);
        white-space: nowrap;
    }
    .home-link .logo-stack {
        display: flex;
        flex-direction: column;
        align-items: center;
        line-height: 1.05;
    }
    .home-link .logo-top-line { font-size: 0.8rem; font-weight: 700; letter-spacing: -0.5px; }
    .home-link .logo-top-line span:nth-child(1) { color: #4285F4; }
    .home-link .logo-top-line span:nth-child(2) { color: #EA4335; }
    .home-link .logo-top-line span:nth-child(3) { color: #FBBC05; }
    .home-link .logo-top-line span:nth-child(4) { color: #34A853; }
    .home-link .logo-bottom-line { font-size: 1.05rem; font-weight: 700; color: var(--text-color); }
    .header-divider { width: 1px; height: 20px; background: var(--border-color); margin: 0 2px; }
    .video-badge-link {
        display: flex;
        align-items: baseline;
        gap: 5px;
        text-decoration: none;
        color: var(--text-color);
        font-weight: 800;
        font-size: 1.05rem;
        letter-spacing: -0.02em;
    }
    .video-badge-link .play-icon {
        font-weight: 500;
        font-size: 0.65rem;
        color: var(--sub-text);
        letter-spacing: 0.02em;
    }
    .search-bar {
        flex: 1;
        max-width: 560px;
        display: flex;
        align-items: center;
        border: 1px solid var(--border-color);
        border-radius: var(--radius-pill);
        padding: 9px 18px;
        color: var(--sub-text);
        background: var(--panel-bg);
        font-size: 0.9rem;
    }
    .header-right {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .login-btn, .upload-btn {
        background-color: var(--accent);
        color: #fff;
        border: none;
        border-radius: var(--radius-pill);
        padding: 9px 20px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        transition: opacity 0.15s;
    }
    .login-btn:hover, .upload-btn:hover { opacity: 0.88; }
    .upload-btn { display: none; }
    .user-area { display: none; align-items: center; gap: 8px; }
    .user-area .profile-btn {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--panel-bg-high);
        border: none;
        cursor: pointer;
        color: var(--text-color);
        font-size: 13px;
        font-weight: 600;
        padding: 5px 14px 5px 5px;
        border-radius: var(--radius-pill);
    }
    .user-area .profile-btn:hover { background: var(--border-color); }
    .user-area img { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; background: var(--sub-text); }
    .logout-btn {
        background: var(--panel-bg);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-pill);
        padding: 8px 16px;
        font-size: 13px;
        font-weight: 600;
        color: var(--text-color);
        cursor: pointer;
        transition: background 0.15s;
    }
    .logout-btn:hover { background: var(--panel-bg-high); }
    .layout {
        padding: 28px;
        max-width: 1600px;
        margin: 0 auto;
    }
    main { min-width: 0; }
    h2.section-title { font-size: 1.15rem; font-weight: 700; margin: 0 0 20px; letter-spacing: -0.01em; }
    .video-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 32px 28px;
    }
    .video-card {
        color: var(--text-color);
        display: block;
    }
    .video-thumb-link, .video-title-link {
        text-decoration: none;
        color: inherit;
        display: block;
    }
    .thumb-wrap {
        position: relative;
        width: 100%;
        aspect-ratio: 16/9;
        border-radius: var(--radius-thumb);
        overflow: hidden;
        background: var(--panel-bg);
        margin-bottom: 12px;
    }
    .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.3s; }
    .video-card:hover .thumb-wrap img { transform: scale(1.05); }
    .video-title { margin: 0; font-size: 1.08rem; font-weight: 600; line-height: 1.35; }
    .video-card:hover .video-title { color: var(--accent); }
    .video-meta { font-size: 0.92rem; color: var(--sub-text); display: inline-block; margin-top: 6px; }
    .channel-link .video-meta { margin-top: 0; }
    .video-title-row { display: flex; align-items: flex-start; gap: 4px; }
    .video-title-row .video-title { flex: 1; }
    .video-menu-btn {
        background: none; border: none; color: var(--sub-text); font-size: 1.2rem;
        cursor: pointer; padding: 0 4px; line-height: 1; flex-shrink: 0; border-radius: 50%;
    }
    .video-menu-btn:hover { color: var(--text-color); }
    .channel-link {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        text-decoration: none;
        color: inherit;
        margin-top: 6px;
    }
    .channel-link:hover .video-meta { color: var(--text-color); }
    .channel-avatar {
        width: 1.6em; height: 1.6em; border-radius: 50%; overflow: hidden; flex-shrink: 0;
        background: var(--panel-bg-high); display: flex; align-items: center; justify-content: center;
        font-weight: 700; color: var(--sub-text); font-size: 0.78em;
    }
    .channel-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .sub-pill {
        display: inline-block;
        font-size: 0.68rem;
        font-weight: 600;
        border: 1px solid var(--border-color);
        border-radius: 5px;
        padding: 2px 8px;
        cursor: pointer;
        background: var(--panel-bg);
        white-space: nowrap;
        transition: background 0.15s;
    }
    .sub-pill.subscribed { background: rgba(255,77,77,0.18); color: var(--accent); border-color: transparent; }

    .series-reco-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 30px;
    }
    .series-reco-card { text-align: center; width: 96px; }
    .series-reco-thumb {
        display: block; width: 80px; height: 80px; margin: 0 auto 10px; border-radius: 50%;
        overflow: hidden; background: var(--panel-bg-high); transition: filter 0.15s;
    }
    .series-reco-card:hover .series-reco-thumb { filter: brightness(1.15); }
    .series-reco-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .series-reco-thumb .avatar-fallback {
        width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
        font-size: 1.6rem; font-weight: 700; color: var(--sub-text);
    }
    .series-reco-name { font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; }
    .series-reco-name a { color: var(--text-color); text-decoration: none; }

    .hamburger-btn {
        background: none;
        border: 1px solid var(--border-color);
        border-radius: var(--radius-pill);
        width: 38px; height: 38px;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer;
        color: var(--text-color);
        font-size: 1.05rem;
        flex-shrink: 0;
    }
    .hamburger-btn:hover { background: var(--panel-bg); }

    .drawer-overlay {
        display: none;
        position: fixed; inset: 0;
        background: rgba(0,0,0,0.45);
        z-index: 1550;
    }
    .drawer-overlay.open { display: block; }

    aside.side-drawer {
        position: fixed;
        top: 0; right: 0;
        width: 320px;
        max-width: 85vw;
        height: 100vh;
        background: var(--bg-color);
        border-left: 1px solid var(--border-color);
        padding: 24px;
        overflow-y: auto;
        transform: translateX(100%);
        transition: transform 0.25s ease;
        z-index: 1600;
    }
    aside.side-drawer.open { transform: translateX(0); }
    .drawer-close-btn {
        position: absolute; top: 16px; right: 18px;
        background: none; border: none; font-size: 18px; cursor: pointer; color: var(--sub-text);
    }
    .aside-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 6px 0 16px;
        font-size: 0.95rem;
        font-weight: 700;
    }
    .aside-header a { color: var(--accent); font-size: 0.78rem; font-weight: 600; text-decoration: none; }
    .sub-series-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px;
        margin: 0 -8px;
        border-radius: 10px;
        text-decoration: none;
        color: var(--text-color);
        transition: background 0.15s;
    }
    .sub-series-item:hover { background: var(--panel-bg); }
    .sub-series-item .avatar {
        width: 40px; height: 40px; border-radius: 50%; background: var(--panel-bg-high);
        display: flex; align-items: center; justify-content: center; font-weight: 700;
        overflow: hidden; flex-shrink: 0;
    }
    .sub-series-item .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .sub-series-item .meta-title { font-size: 0.85rem; font-weight: 600; }
    .sub-series-item .meta-sub { font-size: 0.74rem; color: var(--sub-text); margin-top: 1px; }
    .empty-state { color: var(--sub-text); font-size: 0.85rem; padding: 20px 0; }

    .modal-overlay {
        display: none;
        position: fixed; inset: 0; background: rgba(0,0,0,0.55);
        backdrop-filter: blur(3px);
        z-index: 2000; align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
        background: var(--glass-bg);
        backdrop-filter: blur(20px);
        border: 1px solid var(--border-color);
        color: var(--text-color);
        width: 92%;
        max-width: 480px;
        max-height: 85vh;
        overflow-y: auto;
        border-radius: 20px;
        padding: 24px;
        position: relative;
    }
    .modal-close {
        position: absolute; top: 16px; right: 18px;
        background: none; border: none; font-size: 18px; cursor: pointer; color: var(--sub-text);
    }
    .modal-tabs { display: flex; gap: 8px; margin: 4px 0 18px; border-bottom: 1px solid var(--border-color); }
    .modal-tab {
        background: none; border: none; padding: 8px 4px; font-size: 0.88rem; font-weight: 600; cursor: pointer;
        color: var(--sub-text); border-bottom: 2px solid transparent;
    }
    .modal-tab.active { color: var(--text-color); border-bottom-color: var(--accent); }
    .modal-panel { display: none; }
    .modal-panel.active { display: block; }
    .modal-box h3 { font-size: 0.95rem; font-weight: 700; margin: 18px 0 8px; }
    .modal-box h3:first-child { margin-top: 0; }
    .modal-box label { display: block; font-size: 0.8rem; color: var(--sub-text); margin: 10px 0 5px; }
    .modal-box input[type="text"], .modal-box input[type="email"], .modal-box input[type="url"],
    .modal-box textarea, .modal-box select {
        width: 100%; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--border-color);
        background: var(--panel-bg); color: var(--text-color); font-size: 0.85rem; font-family: inherit;
        outline: none;
    }
    .modal-box input:focus, .modal-box textarea:focus, .modal-box select:focus { border-color: var(--accent); }
    .modal-box button.action {
        margin-top: 16px; background: var(--accent); color: #fff; border: none;
        border-radius: 10px; padding: 10px 18px; font-size: 0.85rem; font-weight: 700; cursor: pointer;
    }
    .modal-box button.action.danger { background: transparent; border: 1px solid #c0392b; color: #e57373; }
    .modal-msg { font-size: 0.8rem; margin-top: 10px; }
    .modal-msg.ok { color: #4ade80; }
    .modal-msg.err { color: #e57373; }
    hr.sep { border: none; border-top: 1px solid var(--border-color); margin: 20px 0; }

    .toggle-row {
        display: flex; align-items: center; justify-content: space-between;
        padding: 9px 0; font-size: 0.85rem;
    }
    .switch { position: relative; display: inline-block; width: 40px; height: 22px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch-slider {
        position: absolute; cursor: pointer; inset: 0; background: var(--border-color);
        border-radius: 22px; transition: 0.2s;
    }
    .switch-slider:before {
        content: ""; position: absolute; height: 16px; width: 16px; left: 3px; bottom: 3px;
        background: #fff; border-radius: 50%; transition: 0.2s;
    }
    .switch input:checked + .switch-slider { background: var(--accent); }
    .switch input:checked + .switch-slider:before { transform: translateX(18px); }
    .series-row {
        display: flex; align-items: center; justify-content: space-between;
        padding: 7px 0; font-size: 0.82rem;
    }

    @media (max-width: 900px) {
        .video-grid { grid-template-columns: repeat(2, 1fr); gap: 18px 14px; }
    }
    @media (max-width: 800px) {
        .layout { padding: 16px; }
        .search-bar { display: none; }
    }
</style>
</head>
<body>

<header>
    <a href="index.html" class="home-link">
        <span class="logo-stack">
            <span class="logo-top-line"><span>신</span><span>현</span><span>일</span><span>의</span></span>
            <span class="logo-bottom-line">Search</span>
        </span>
    </a>
    <span class="header-divider"></span>
    <a href="video.html" class="video-badge-link">HYUNIL <span class="play-icon">VIDEO</span></a>
    <div class="search-bar">🔍 무엇이든 검색해보세요...</div>
    <div class="header-right">
        <button class="hamburger-btn" id="hamburger-btn" aria-label="구독 시리즈 열기">☰</button>
        <button class="upload-btn" id="upload-btn">업로드</button>
        <button class="login-btn" id="login-btn">로그인</button>
        <div class="user-area" id="user-area">
            <button class="profile-btn" id="profile-btn">
                <img id="user-photo" src="" alt="프로필">
                <span id="user-name"></span>
            </button>
            <button class="logout-btn" id="logout-btn">로그아웃</button>
        </div>
    </div>
</header>

<div class="layout">
    <main>
        <h2 class="section-title">추천 비디오</h2>
        <div class="video-grid" id="video-grid">
            <div class="empty-state">불러오는 중...</div>
        </div>

        <h2 class="section-title" style="margin-top: 32px;">추천 시리즈</h2>
        <div class="series-reco-grid" id="series-reco-grid">
            <div class="empty-state">불러오는 중...</div>
        </div>
    </main>
</div>

<div class="drawer-overlay" id="drawer-overlay"></div>
<aside class="side-drawer" id="side-drawer">
    <button class="drawer-close-btn" id="drawer-close-btn">✕</button>
    <div class="aside-header">
        <span>구독 시리즈</span>
        <a href="series-list.html">전체보기</a>
    </div>
    <div id="subscribed-list">
        <div class="empty-state">로그인하면 구독한 시리즈가 여기 표시됩니다.</div>
    </div>
</aside>

<div class="modal-overlay" id="upload-modal">
    <div class="modal-box">
        <button class="modal-close" data-close="upload-modal">✕</button>
        <h3>영상 업로드</h3>
        <label>시리즈 선택</label>
        <select id="video-series-select"></select>
        <label>제목</label>
        <input type="text" id="video-title-input" placeholder="영상 제목">
        <label>썸네일 이미지 URL</label>
        <input type="url" id="video-thumb-input" placeholder="https://...">
        <label>유튜브 링크</label>
        <input type="url" id="video-url-input" placeholder="https://youtube.com/watch?v=...">
        <button class="action" id="upload-video-submit">업로드</button>
        <div class="modal-msg" id="upload-video-msg"></div>
    </div>
</div>

<div class="modal-overlay" id="edit-video-modal">
    <div class="modal-box">
        <button class="modal-close" data-close="edit-video-modal">✕</button>
        <h3>영상 설정</h3>
        <label>제목</label>
        <input type="text" id="edit-video-title">
        <label>썸네일 이미지 URL</label>
        <input type="url" id="edit-video-thumb">
        <label>업로드 날짜</label>
        <input type="text" id="edit-video-date" disabled>
        <button class="action" id="edit-video-save">저장</button>
        <button class="action danger" id="edit-video-delete" style="margin-left: 8px;">영상 삭제</button>
        <div class="modal-msg" id="edit-video-msg"></div>
    </div>
</div>

<div class="modal-overlay" id="settings-modal">
    <div class="modal-box">
        <button class="modal-close" data-close="settings-modal">✕</button>
        <div class="modal-tabs" id="settings-tabs">
            <button class="modal-tab active" data-tab="general">설정</button>
        </div>

        <div class="modal-panel active" id="tab-general">
            <div class="empty-state">설정 기능은 준비 중입니다.</div>
        </div>

        <div class="modal-panel" id="tab-manage">
            <div id="manage-create-section">
                <h3>새 시리즈 만들기</h3>
                <label>시리즈 이름</label>
                <input type="text" id="new-series-name" placeholder="예: 나이트 크롤러">
                <label>설명</label>
                <textarea id="new-series-desc" rows="2" placeholder="시리즈 소개"></textarea>
                <label>썸네일(아이콘) 이미지 URL</label>
                <input type="url" id="new-series-thumb-input" placeholder="https://...">
                <label>업로드 권한을 함께 줄 계정 이메일 (선택, 쉼표로 구분)</label>
                <input type="text" id="new-series-owners" placeholder="user1@gmail.com, user2@gmail.com">
                <button class="action" id="create-series-btn">시리즈 만들기</button>
                <div class="modal-msg" id="create-series-msg"></div>
            </div>

            <div id="manage-delete-section">
                <hr class="sep">
                <h3>시리즈 삭제</h3>
                <label>시리즈 선택</label>
                <select id="delete-series-select"></select>
                <button class="action danger" id="delete-series-btn">이 시리즈 삭제</button>
                <div class="modal-msg" id="delete-series-msg"></div>
            </div>
        </div>

        <div class="modal-panel" id="tab-admin">
            <h3>계정별 권한 관리</h3>
            <label>이메일</label>
            <input type="email" id="perm-email-input" placeholder="user@gmail.com">
            <button class="action" id="perm-lookup-btn">조회</button>
            <div class="modal-msg" id="perm-lookup-msg"></div>

            <div id="perm-toggles" style="display:none;">
                <div class="toggle-row">
                    <span>시리즈 생성 권한</span>
                    <label class="switch"><input type="checkbox" id="toggle-create"><span class="switch-slider"></span></label>
                </div>
                <div class="toggle-row">
                    <span>시리즈 삭제 권한</span>
                    <label class="switch"><input type="checkbox" id="toggle-delete"><span class="switch-slider"></span></label>
                </div>
                <hr class="sep">
                <h3>시리즈별 업로드 권한</h3>
                <div id="perm-series-list"></div>
            </div>
        </div>
    </div>
</div>

<script>
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
</script>

<script type="module">
    import {
        watchAuth, signInWithGoogle, signOutUser,
        getRandomRecommendedVideos, getVideosForSeries, getAllSeries, getSeries,
        getUserDoc, subscribeToSeries, unsubscribeFromSeries,
        canUploadToSeries, addVideoToSeries, updateVideo, deleteVideoFromSeries, formatDate,
        isSiteOwner, canUserCreateSeries, canUserDeleteSeries, createSeries, deleteSeries,
        getPermissions, setPermission, addSeriesOwner, removeSeriesOwner
    } from './auth.js';

    const loginBtn = document.getElementById('login-btn');
    const uploadBtn = document.getElementById('upload-btn');
    const userArea = document.getElementById('user-area');
    const userPhoto = document.getElementById('user-photo');
    const userName = document.getElementById('user-name');
    const logoutBtn = document.getElementById('logout-btn');
    const profileBtn = document.getElementById('profile-btn');
    const videoGrid = document.getElementById('video-grid');
    const subscribedList = document.getElementById('subscribed-list');
    const hamburgerBtn = document.getElementById('hamburger-btn');
    const sideDrawer = document.getElementById('side-drawer');
    const drawerOverlay = document.getElementById('drawer-overlay');
    const drawerCloseBtn = document.getElementById('drawer-close-btn');

    function openDrawer() { sideDrawer.classList.add('open'); drawerOverlay.classList.add('open'); }
    function closeDrawer() { sideDrawer.classList.remove('open'); drawerOverlay.classList.remove('open'); }
    hamburgerBtn.addEventListener('click', () => {
        sideDrawer.classList.contains('open') ? closeDrawer() : openDrawer();
    });
    drawerOverlay.addEventListener('click', closeDrawer);
    drawerCloseBtn.addEventListener('click', closeDrawer);

    let currentUser = null;
    let currentSubs = [];
    let seriesCache = {};
    let mySeries = [];
    let iCanCreateSeries = false;
    let iCanDeleteSeries = false;
    let iAmAdmin = false;

    loginBtn.addEventListener('click', async () => {
        try { await signInWithGoogle(); }
        catch (err) { alert('로그인에 실패했습니다: ' + err.message); }
    });
    logoutBtn.addEventListener('click', () => signOutUser());

    document.querySelectorAll('.modal-close').forEach(btn => {
        btn.addEventListener('click', () => {
            document.getElementById(btn.dataset.close).classList.remove('open');
        });
    });
    document.querySelectorAll('.modal-overlay').forEach(overlay => {
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) overlay.classList.remove('open');
        });
    });

    async function loadSeriesCache() {
        const all = await getAllSeries();
        seriesCache = {};
        all.forEach(s => seriesCache[s.id] = s);
        return all;
    }

    async function renderVideos() {
        let videos = [];
        try {
            videos = await getRandomRecommendedVideos(12);
        } catch (e) {
            console.error(e);
            videoGrid.innerHTML = '<div class="empty-state">영상을 불러오지 못했습니다. 잠시 후 다시 시도해주세요.</div>';
            return;
        }
        if (videos.length === 0) {
            videoGrid.innerHTML = '<div class="empty-state">아직 업로드된 영상이 없습니다.</div>';
            return;
        }
        videoGrid.innerHTML = '';
        videos.forEach(v => {
            const series = seriesCache[v.seriesId];
            const canManage = currentUser && (iAmAdmin || canUploadToSeries(series, currentUser.email));
            const card = document.createElement('div');
            card.className = 'video-card';
            const channelHtml = series
                ? `<a class="channel-link" href="series.html?id=${v.seriesId}">
                        <span class="video-meta">${series.name}</span>
                        <span class="channel-avatar">${series.thumbnail ? `<img src="${series.thumbnail}" alt="${series.name}">` : `${series.name[0]}`}</span>
                   </a>`
                : `<span class="video-meta">알 수 없는 시리즈</span>`;
            card.innerHTML = `
                <a class="video-thumb-link" href="watch.html?s=${v.seriesId}&v=${v.id}">
                    <div class="thumb-wrap"><img src="${v.thumbnailUrl}" alt="${v.title}"></div>
                </a>
                <div class="video-title-row">
                    <a class="video-title-link" href="watch.html?s=${v.seriesId}&v=${v.id}">
                        <div class="video-title">${v.title}</div>
                    </a>
                    ${canManage ? `<button class="video-menu-btn" data-series="${v.seriesId}" data-video="${v.id}" data-title="${(v.title || '').replace(/"/g, '&quot;')}" data-thumb="${(v.thumbnailUrl || '').replace(/"/g, '&quot;')}">⋮</button>` : ''}
                </div>
                ${channelHtml}
            `;
            videoGrid.appendChild(card);
        });

        videoGrid.querySelectorAll('.video-menu-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                openEditVideoModal(btn.dataset.series, btn.dataset.video, btn.dataset.title, btn.dataset.thumb);
            });
        });
    }

    async function renderRecommendedSeries() {
        const grid = document.getElementById('series-reco-grid');
        const allSeries = Object.values(seriesCache);
        if (allSeries.length === 0) {
            grid.innerHTML = '<div class="empty-state">아직 만들어진 시리즈가 없습니다.</div>';
            return;
        }
        grid.innerHTML = allSeries.map(s => {
            const isSub = currentSubs.includes(s.id);
            return `
                <div class="series-reco-card">
                    <a class="series-reco-thumb" href="series.html?id=${s.id}">
                        ${s.thumbnail ? `<img src="${s.thumbnail}">` : `<div class="avatar-fallback">${s.name[0]}</div>`}
                    </a>
                    <div class="series-reco-name"><a href="series.html?id=${s.id}">${s.name}</a></div>
                    <span class="sub-pill ${isSub ? 'subscribed' : ''}" data-series="${s.id}">${isSub ? '구독중' : '구독'}</span>
                </div>
            `;
        }).join('');
        grid.querySelectorAll('.sub-pill').forEach(pill => {
            pill.addEventListener('click', async () => {
                if (!currentUser) { alert('구독하려면 먼저 로그인해주세요.'); return; }
                const seriesId = pill.dataset.series;
                if (currentSubs.includes(seriesId)) {
                    await unsubscribeFromSeries(currentUser.uid, seriesId);
                    currentSubs = currentSubs.filter(id => id !== seriesId);
                } else {
                    await subscribeToSeries(currentUser.uid, seriesId);
                    currentSubs.push(seriesId);
                }
                renderRecommendedSeries();
                renderVideos();
                renderSubscribedList();
            });
        });
    }

    let editingVideoSeriesId = null;
    let editingVideoId = null;

    function openEditVideoModal(seriesId, videoId, title, thumbnailUrl) {
        editingVideoSeriesId = seriesId;
        editingVideoId = videoId;
        document.getElementById('edit-video-title').value = title || '';
        document.getElementById('edit-video-thumb').value = thumbnailUrl || '';
        document.getElementById('edit-video-date').value = '불러오는 중...';
        document.getElementById('edit-video-msg').textContent = '';
        document.getElementById('edit-video-modal').classList.add('open');
        getVideoCreatedDate(seriesId, videoId);
    }

    async function getVideoCreatedDate(seriesId, videoId) {
        // videos 목록을 다시 조회해 해당 영상의 생성일을 찾음
        try {
            const vids = await getVideosForSeries(seriesId);
            const v = vids.find(x => x.id === videoId);
            document.getElementById('edit-video-date').value = v ? (formatDate(v.createdAt) || '알 수 없음') : '알 수 없음';
        } catch (e) {
            document.getElementById('edit-video-date').value = '알 수 없음';
        }
    }

    document.getElementById('edit-video-save').addEventListener('click', async () => {
        const title = document.getElementById('edit-video-title').value.trim();
        const thumbnailUrl = document.getElementById('edit-video-thumb').value.trim();
        const msg = document.getElementById('edit-video-msg');
        if (!title || !thumbnailUrl) { msg.textContent = '제목과 썸네일 URL을 입력해주세요.'; msg.className = 'modal-msg err'; return; }
        try {
            await updateVideo(editingVideoSeriesId, editingVideoId, { title, thumbnailUrl });
            msg.textContent = '저장되었습니다!'; msg.className = 'modal-msg ok';
        } catch (e) {
            msg.textContent = '오류: ' + e.message; msg.className = 'modal-msg err';
            return;
        }
        try { await renderVideos(); } catch (e) { console.error(e); }
    });

    document.getElementById('edit-video-delete').addEventListener('click', async () => {
        const msg = document.getElementById('edit-video-msg');
        if (!confirm('이 영상을 삭제할까요? 되돌릴 수 없습니다.')) return;
        try {
            await deleteVideoFromSeries(editingVideoSeriesId, editingVideoId);
            msg.textContent = '삭제되었습니다.'; msg.className = 'modal-msg ok';
        } catch (e) {
            msg.textContent = '오류: ' + e.message; msg.className = 'modal-msg err';
            return;
        }
        document.getElementById('edit-video-modal').classList.remove('open');
        try { await renderVideos(); } catch (e) { console.error(e); }
    });

    async function renderSubscribedList() {
        if (!currentUser || currentSubs.length === 0) {
            subscribedList.innerHTML = '<div class="empty-state">아직 구독한 시리즈가 없습니다.</div>';
            return;
        }
        subscribedList.innerHTML = '';
        for (const seriesId of currentSubs) {
            const series = seriesCache[seriesId] || await getSeries(seriesId);
            if (!series) continue;
            const el = document.createElement('a');
            el.className = 'sub-series-item';
            el.href = `series.html?id=${seriesId}`;
            el.innerHTML = `
                <div class="avatar">${series.thumbnail ? `<img src="${series.thumbnail}">` : series.name[0]}</div>
                <div>
                    <div class="meta-title">${series.name}</div>
                    <div class="meta-sub">구독중</div>
                </div>
            `;
            subscribedList.appendChild(el);
        }
    }

    uploadBtn.addEventListener('click', () => {
        const sel = document.getElementById('video-series-select');
        sel.innerHTML = mySeries.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
        document.getElementById('upload-modal').classList.add('open');
    });

    document.getElementById('upload-video-submit').addEventListener('click', async () => {
        const seriesId = document.getElementById('video-series-select').value;
        const title = document.getElementById('video-title-input').value.trim();
        const thumbnailUrl = document.getElementById('video-thumb-input').value.trim();
        const youtubeUrl = document.getElementById('video-url-input').value.trim();
        const msg = document.getElementById('upload-video-msg');
        if (!seriesId || !title || !thumbnailUrl || !youtubeUrl) {
            msg.textContent = '모든 항목을 입력해주세요.'; msg.className = 'modal-msg err'; return;
        }
        try {
            await addVideoToSeries(seriesId, { title, thumbnailUrl, youtubeUrl, uploaderEmail: currentUser.email });
        } catch (e) {
            msg.textContent = '오류: ' + e.message; msg.className = 'modal-msg err';
            return;
        }
        msg.textContent = '영상이 업로드되었습니다!'; msg.className = 'modal-msg ok';
        document.getElementById('video-title-input').value = '';
        document.getElementById('video-thumb-input').value = '';
        document.getElementById('video-url-input').value = '';
        try {
            await refreshUserState();
        } catch (e) {
            console.error('새로고침 중 오류(업로드 자체는 성공):', e);
        }
    });

    profileBtn.addEventListener('click', () => {
        buildSettingsTabs();
        document.getElementById('settings-modal').classList.add('open');
    });

    function buildSettingsTabs() {
        const tabsWrap = document.getElementById('settings-tabs');
        tabsWrap.innerHTML = '<button class="modal-tab active" data-tab="general">설정</button>';
        if (iCanCreateSeries || iCanDeleteSeries) tabsWrap.innerHTML += '<button class="modal-tab" data-tab="manage">시리즈 관리</button>';
        if (iAmAdmin) tabsWrap.innerHTML += '<button class="modal-tab" data-tab="admin">관리자</button>';

        document.getElementById('manage-create-section').style.display = iCanCreateSeries ? 'block' : 'none';
        document.getElementById('manage-delete-section').style.display = iCanDeleteSeries ? 'block' : 'none';

        document.querySelectorAll('.modal-panel').forEach(p => p.classList.remove('active'));
        document.getElementById('tab-general').classList.add('active');

        tabsWrap.querySelectorAll('.modal-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                tabsWrap.querySelectorAll('.modal-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                document.querySelectorAll('.modal-panel').forEach(p => p.classList.remove('active'));
                document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
            });
        });

        if (iCanDeleteSeries) {
            const sel = document.getElementById('delete-series-select');
            sel.innerHTML = Object.values(seriesCache).map(s => `<option value="${s.id}">${s.name}</option>`).join('');
        }
    }

    document.getElementById('create-series-btn').addEventListener('click', async () => {
        const name = document.getElementById('new-series-name').value.trim();
        const description = document.getElementById('new-series-desc').value.trim();
        const thumbnail = document.getElementById('new-series-thumb-input').value.trim();
        const ownersRaw = document.getElementById('new-series-owners').value.trim();
        const ownerEmails = ownersRaw ? ownersRaw.split(',').map(s => s.trim()).filter(Boolean) : [];
        const msg = document.getElementById('create-series-msg');
        if (!name) { msg.textContent = '시리즈 이름을 입력해주세요.'; msg.className = 'modal-msg err'; return; }
        try {
            await createSeries({ name, description, thumbnail, ownerEmails, creatorEmail: currentUser.email });
        } catch (e) {
            msg.textContent = '오류: ' + e.message; msg.className = 'modal-msg err';
            return;
        }
        // 생성은 성공했으므로 화면에 성공 메시지를 먼저 확정
        msg.textContent = '시리즈가 생성되었습니다!'; msg.className = 'modal-msg ok';
        document.getElementById('new-series-name').value = '';
        document.getElementById('new-series-desc').value = '';
        document.getElementById('new-series-thumb-input').value = '';
        document.getElementById('new-series-owners').value = '';
        // 목록 새로고침은 별도로 처리 - 여기서 실패해도 위 성공 메시지는 그대로 유지됨
        try {
            await refreshUserState();
            buildSettingsTabs();
        } catch (e) {
            console.error('새로고침 중 오류(시리즈 생성 자체는 성공):', e);
        }
    });

    document.getElementById('delete-series-btn').addEventListener('click', async () => {
        const seriesId = document.getElementById('delete-series-select').value;
        const msg = document.getElementById('delete-series-msg');
        if (!seriesId) { msg.textContent = '삭제할 시리즈를 선택해주세요.'; msg.className = 'modal-msg err'; return; }
        const series = seriesCache[seriesId];
        if (!confirm(`정말 "${series ? series.name : seriesId}" 시리즈를 삭제할까요? 이 작업은 되돌릴 수 없습니다.`)) return;
        try {
            await deleteSeries(seriesId);
        } catch (e) {
            msg.textContent = '오류: ' + e.message; msg.className = 'modal-msg err';
            return;
        }
        msg.textContent = '시리즈가 삭제되었습니다.'; msg.className = 'modal-msg ok';
        try {
            await refreshUserState();
            buildSettingsTabs();
        } catch (e) {
            console.error('새로고침 중 오류(삭제 자체는 성공):', e);
        }
    });

    document.getElementById('perm-lookup-btn').addEventListener('click', async () => {
        const email = document.getElementById('perm-email-input').value.trim();
        const msg = document.getElementById('perm-lookup-msg');
        const togglesWrap = document.getElementById('perm-toggles');
        if (!email) { msg.textContent = '이메일을 입력해주세요.'; msg.className = 'modal-msg err'; return; }
        try {
            if (isSiteOwner(email)) {
                msg.textContent = '이 계정은 사이트 관리자(firebase-config.js의 SITE_OWNER_EMAILS)라서 아래 토글과 상관없이 이미 모든 권한을 가지고 있습니다.';
                msg.className = 'modal-msg ok';
            } else {
                msg.textContent = ''; msg.className = 'modal-msg';
            }
            const perm = await getPermissions(email);
            document.getElementById('toggle-create').checked = !!perm.canCreateSeries;
            document.getElementById('toggle-delete').checked = !!perm.canDeleteSeries;

            const seriesListEl = document.getElementById('perm-series-list');
            const allSeries = Object.values(seriesCache);
            if (allSeries.length === 0) {
                seriesListEl.innerHTML = '<div class="empty-state">아직 만들어진 시리즈가 없습니다.</div>';
            } else {
                seriesListEl.innerHTML = allSeries.map(s => `
                    <div class="series-row">
                        <span>${s.name}</span>
                        <label class="switch">
                            <input type="checkbox" class="upload-toggle" data-series="${s.id}" ${(s.ownerEmails || []).includes(email) ? 'checked' : ''}>
                            <span class="switch-slider"></span>
                        </label>
                    </div>
                `).join('');
                seriesListEl.querySelectorAll('.upload-toggle').forEach(t => {
                    t.addEventListener('change', async () => {
                        try {
                            if (t.checked) await addSeriesOwner(t.dataset.series, email);
                            else await removeSeriesOwner(t.dataset.series, email);
                            await loadSeriesCache();
                        } catch (e) {
                            alert('오류: ' + e.message);
                            t.checked = !t.checked;
                        }
                    });
                });
            }
            togglesWrap.style.display = 'block';
        } catch (e) {
            msg.textContent = '오류: ' + e.message; msg.className = 'modal-msg err';
        }
    });

    document.getElementById('toggle-create').addEventListener('change', async (e) => {
        const email = document.getElementById('perm-email-input').value.trim();
        try { await setPermission(email, 'canCreateSeries', e.target.checked); }
        catch (err) { alert('오류: ' + err.message); e.target.checked = !e.target.checked; }
    });
    document.getElementById('toggle-delete').addEventListener('change', async (e) => {
        const email = document.getElementById('perm-email-input').value.trim();
        try { await setPermission(email, 'canDeleteSeries', e.target.checked); }
        catch (err) { alert('오류: ' + err.message); e.target.checked = !e.target.checked; }
    });

    async function refreshUserState() {
        try { await loadSeriesCache(); } catch (e) { console.error(e); }
        if (currentUser) {
            mySeries = Object.values(seriesCache).filter(s => canUploadToSeries(s, currentUser.email));
            uploadBtn.style.display = mySeries.length > 0 ? 'inline-block' : 'none';
            iCanCreateSeries = await canUserCreateSeries(currentUser.email);
            iCanDeleteSeries = await canUserDeleteSeries(currentUser.email);
            iAmAdmin = isSiteOwner(currentUser.email);
        } else {
            mySeries = [];
            uploadBtn.style.display = 'none';
            iCanCreateSeries = false;
            iCanDeleteSeries = false;
            iAmAdmin = false;
        }
        try { await renderVideos(); } catch (e) { console.error(e); }
        try { await renderRecommendedSeries(); } catch (e) { console.error(e); }
        try { await renderSubscribedList(); } catch (e) { console.error(e); }
    }

    watchAuth(async (user) => {
        currentUser = user;
        try {
            if (user) {
                loginBtn.style.display = 'none';
                userArea.style.display = 'flex';
                userPhoto.src = user.photoURL || '';
                userName.textContent = user.displayName || user.email;
                const userDoc = await getUserDoc(user.uid);
                currentSubs = (userDoc && userDoc.subscriptions) || [];
            } else {
                loginBtn.style.display = 'inline-block';
                userArea.style.display = 'none';
                currentSubs = [];
            }
        } catch (e) {
            console.error(e);
        }
        try {
            await refreshUserState();
        } catch (e) {
            console.error(e);
        }
    });
</script>
</body>
</html>
