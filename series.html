<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시리즈 - HYUNIL VIDEO</title>
<style>
    :root {
        --bg-color: #ffffff; --panel-bg: #f8f9fa; --text-color: #202124;
        --sub-text: #606368; --border-color: #e5e5e5; --accent: #ff0000; --link-color: #4285F4;
    }
    [data-theme="dark"] {
        --bg-color: #181818; --panel-bg: #232323; --text-color: #f1f3f4;
        --sub-text: #aaaaaa; --border-color: #333; --accent: #ff4d4d; --link-color: #8ab4f8;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Malgun Gothic', sans-serif; background: var(--bg-color); color: var(--text-color); }
    header { display: flex; align-items: center; gap: 16px; padding: 14px 28px; border-bottom: 1px solid var(--border-color); }
    header a.back { text-decoration: none; color: var(--text-color); font-weight: bold; }
    .content { padding: 24px 28px; }
    .series-header { display: flex; align-items: center; gap: 20px; margin-bottom: 28px; }
    .avatar {
        width: 84px; height: 84px; border-radius: 50%; background: var(--panel-bg);
        display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: bold;
        overflow: hidden; flex-shrink: 0;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .series-name { font-size: 1.4rem; font-weight: bold; margin: 0 0 4px; }
    .series-desc { color: var(--sub-text); font-size: 0.9rem; margin: 0 0 10px; }
    .sub-btn {
        border: none; border-radius: 18px; padding: 8px 20px; font-size: 0.9rem;
        font-weight: bold; cursor: pointer; background: var(--accent); color: #fff;
    }
    .sub-btn.subscribed { background: var(--panel-bg); color: var(--text-color); border: 1px solid var(--border-color); }
    .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; }
    .video-card { text-decoration: none; color: var(--text-color); display: block; }
    .thumb-wrap { width: 100%; aspect-ratio: 16/9; border-radius: 10px; overflow: hidden; background: var(--panel-bg); }
    .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .video-title { margin: 8px 0 2px; font-size: 0.92rem; font-weight: 600; line-height: 1.3; }
    .video-title-row { display: flex; align-items: flex-start; gap: 4px; }
    .video-title-row .video-title { flex: 1; }
    .video-menu-btn {
        background: none; border: none; color: var(--sub-text); font-size: 1rem;
        cursor: pointer; padding: 0 4px; line-height: 1; flex-shrink: 0;
    }
    .video-menu-btn:hover { color: var(--text-color); }
    .empty-state { color: var(--sub-text); font-size: 0.9rem; padding: 20px 0; }

    .modal-overlay {
        display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
        z-index: 2000; align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
        background: var(--bg-color); color: var(--text-color); width: 92%; max-width: 420px;
        max-height: 85vh; overflow-y: auto; border-radius: 14px; padding: 22px; position: relative;
    }
    .modal-close {
        position: absolute; top: 14px; right: 16px;
        background: none; border: none; font-size: 18px; cursor: pointer; color: var(--sub-text);
    }
    .modal-box h3 { font-size: 0.95rem; margin: 0 0 8px; }
    .modal-box label { display: block; font-size: 0.82rem; color: var(--sub-text); margin: 10px 0 4px; }
    .modal-box input[type="text"], .modal-box input[type="url"] {
        width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border-color);
        background: var(--panel-bg); color: var(--text-color); font-size: 0.85rem;
    }
    .modal-box button.action {
        margin-top: 14px; background: var(--link-color); color: #fff; border: none;
        border-radius: 8px; padding: 9px 16px; font-size: 0.85rem; font-weight: bold; cursor: pointer;
    }
    .modal-box button.action.danger { background: #c0392b; }
    .modal-msg { font-size: 0.8rem; margin-top: 8px; }
    .modal-msg.ok { color: #1a7f37; }
    .modal-msg.err { color: #c0392b; }
</style>
</head>
<body>

<header>
    <a href="video.html" class="back">← HYUNIL VIDEO</a>
</header>

<div class="content">
    <div class="series-header" id="series-header">
        <div class="empty-state">불러오는 중...</div>
    </div>
    <div class="video-grid" id="video-grid"></div>
</div>

<div class="modal-overlay" id="edit-video-modal">
    <div class="modal-box">
        <button class="modal-close" data-close="edit-video-modal">✕</button>
        <h3>영상 설정</h3>
        <label>제목</label>
        <input type="text" id="edit-video-title">
        <label>썸네일 이미지 URL</label>
        <input type="url" id="edit-video-thumb">
        <label>업로드 날짜</label>
        <input type="text" id="edit-video-date" disabled>
        <button class="action" id="edit-video-save">저장</button>
        <button class="action danger" id="edit-video-delete" style="margin-left: 8px;">영상 삭제</button>
        <div class="modal-msg" id="edit-video-msg"></div>
    </div>
</div>

<script>
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
</script>

<script type="module">
    import {
        watchAuth, signInWithGoogle, getSeries, getVideosForSeries,
        getUserDoc, subscribeToSeries, unsubscribeFromSeries,
        canUploadToSeries, isSiteOwner, updateVideo, deleteVideoFromSeries, formatDate
    } from './auth.js';

    const params = new URLSearchParams(location.search);
    const seriesId = params.get('id');
    const headerEl = document.getElementById('series-header');
    const gridEl = document.getElementById('video-grid');

    let currentUser = null;
    let currentSubs = [];
    let series = null;

    function renderHeader() {
        if (!series) return;
        const isSub = currentSubs.includes(seriesId);
        headerEl.innerHTML = `
            <div class="avatar">${series.thumbnail ? `<img src="${series.thumbnail}">` : series.name[0]}</div>
            <div>
                <div class="series-name">${series.name}</div>
                <div class="series-desc">${series.description || ''}</div>
                <button class="sub-btn ${isSub ? 'subscribed' : ''}" id="sub-btn">${isSub ? '구독중' : '구독'}</button>
            </div>
        `;
        document.getElementById('sub-btn').addEventListener('click', async () => {
            if (!currentUser) {
                try { await signInWithGoogle(); } catch (e) { return; }
            }
            if (currentSubs.includes(seriesId)) {
                await unsubscribeFromSeries(currentUser.uid, seriesId);
                currentSubs = currentSubs.filter(id => id !== seriesId);
            } else {
                await subscribeToSeries(currentUser.uid, seriesId);
                currentSubs.push(seriesId);
            }
            renderHeader();
        });
    }

    async function renderVideos() {
        let videos = [];
        try {
            videos = await getVideosForSeries(seriesId);
        } catch (e) {
            console.error(e);
            gridEl.innerHTML = '<div class="empty-state">영상을 불러오지 못했습니다.</div>';
            return;
        }
        if (videos.length === 0) {
            gridEl.innerHTML = '<div class="empty-state">아직 업로드된 영상이 없습니다.</div>';
            return;
        }
        const canManage = currentUser && (isSiteOwner(currentUser.email) || canUploadToSeries(series, currentUser.email));
        gridEl.innerHTML = videos.map(v => `
            <div>
                <a class="video-card" href="${v.youtubeUrl}" target="_blank" rel="noopener">
                    <div class="thumb-wrap"><img src="${v.thumbnailUrl}" alt="${v.title}"></div>
                </a>
                <div class="video-title-row">
                    <div class="video-title">${v.title}</div>
                    ${canManage ? `<button class="video-menu-btn" data-video="${v.id}" data-title="${(v.title || '').replace(/"/g, '&quot;')}" data-thumb="${(v.thumbnailUrl || '').replace(/"/g, '&quot;')}">⋮</button>` : ''}
                </div>
            </div>
        `).join('');

        gridEl.querySelectorAll('.video-menu-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                openEditVideoModal(btn.dataset.video, btn.dataset.title, btn.dataset.thumb);
            });
        });
    }

    document.querySelectorAll('.modal-close').forEach(btn => {
        btn.addEventListener('click', () => {
            document.getElementById(btn.dataset.close).classList.remove('open');
        });
    });
    document.querySelectorAll('.modal-overlay').forEach(overlay => {
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) overlay.classList.remove('open');
        });
    });

    let editingVideoId = null;

    function openEditVideoModal(videoId, title, thumbnailUrl) {
        editingVideoId = videoId;
        document.getElementById('edit-video-title').value = title || '';
        document.getElementById('edit-video-thumb').value = thumbnailUrl || '';
        document.getElementById('edit-video-date').value = '불러오는 중...';
        document.getElementById('edit-video-msg').textContent = '';
        document.getElementById('edit-video-modal').classList.add('open');
        getVideosForSeries(seriesId).then(vids => {
            const v = vids.find(x => x.id === videoId);
            document.getElementById('edit-video-date').value = v ? (formatDate(v.createdAt) || '알 수 없음') : '알 수 없음';
        }).catch(() => {
            document.getElementById('edit-video-date').value = '알 수 없음';
        });
    }

    document.getElementById('edit-video-save').addEventListener('click', async () => {
        const title = document.getElementById('edit-video-title').value.trim();
        const thumbnailUrl = document.getElementById('edit-video-thumb').value.trim();
        const msg = document.getElementById('edit-video-msg');
        if (!title || !thumbnailUrl) { msg.textContent = '제목과 썸네일 URL을 입력해주세요.'; msg.className = 'modal-msg err'; return; }
        try {
            await updateVideo(seriesId, editingVideoId, { title, thumbnailUrl });
        } catch (e) {
            msg.textContent = '오류: ' + e.message; msg.className = 'modal-msg err';
            return;
        }
        msg.textContent = '저장되었습니다!'; msg.className = 'modal-msg ok';
        try { await renderVideos(); } catch (e) { console.error(e); }
    });

    document.getElementById('edit-video-delete').addEventListener('click', async () => {
        const msg = document.getElementById('edit-video-msg');
        if (!confirm('이 영상을 삭제할까요? 되돌릴 수 없습니다.')) return;
        try {
            await deleteVideoFromSeries(seriesId, editingVideoId);
        } catch (e) {
            msg.textContent = '오류: ' + e.message; msg.className = 'modal-msg err';
            return;
        }
        msg.textContent = '삭제되었습니다.'; msg.className = 'modal-msg ok';
        document.getElementById('edit-video-modal').classList.remove('open');
        try { await renderVideos(); } catch (e) { console.error(e); }
    });

    async function init() {
        if (!seriesId) {
            headerEl.innerHTML = '<div class="empty-state">시리즈 ID가 없습니다.</div>';
            return;
        }
        series = await getSeries(seriesId);
        if (!series) {
            headerEl.innerHTML = '<div class="empty-state">존재하지 않는 시리즈입니다.</div>';
            return;
        }
        renderHeader();
        try { await renderVideos(); } catch (e) { console.error(e); }
    }

    watchAuth(async (user) => {
        currentUser = user;
        if (user) {
            const userDoc = await getUserDoc(user.uid);
            currentSubs = (userDoc && userDoc.subscriptions) || [];
        } else {
            currentSubs = [];
        }
        renderHeader();
        if (series) {
            try { await renderVideos(); } catch (e) { console.error(e); }
        }
    });

    init();
</script>
</body>
</html>
