<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시리즈 - HYUNIL VIDEO</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-color: #ffffff; --panel-bg: #f8f9fa; --panel-bg-high: #eeeeee; --text-color: #131313;
        --sub-text: #606368; --border-color: #e5e5e5; --accent: #ff0000; --link-color: #4285F4;
        --glass-bg: rgba(255,255,255,0.75);
    }
    [data-theme="dark"] {
        --bg-color: #131313; --panel-bg: #1c1b1b; --panel-bg-high: #2a2a2a; --text-color: #e5e2e1;
        --sub-text: #a8a5a4; --border-color: #262626; --accent: #ff4d4d; --link-color: #8ab4f8;
        --glass-bg: rgba(28,27,27,0.75);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Inter', 'Malgun Gothic', sans-serif; background: var(--bg-color); color: var(--text-color); letter-spacing: -0.01em; }
    header {
        display: flex; align-items: center; gap: 16px; padding: 14px 28px; border-bottom: 1px solid var(--border-color);
        position: sticky; top: 0; z-index: 100; background: var(--bg-color);
    }
    header a.back { text-decoration: none; color: var(--text-color); font-weight: 700; font-size: 0.92rem; display: flex; align-items: center; gap: 8px; }
    header a.back:hover { opacity: 0.8; }
    .content { padding: 28px; max-width: 1600px; margin: 0 auto; }
    .series-header { display: flex; align-items: center; gap: 24px; margin-bottom: 36px; flex-wrap: wrap; }
    .avatar {
        width: 92px; height: 92px; border-radius: 50%; background: var(--panel-bg-high);
        display: flex; align-items: center; justify-content: center; font-size: 2.1rem; font-weight: 700;
        overflow: hidden; flex-shrink: 0;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .series-name { font-size: 1.5rem; font-weight: 800; margin: 0 0 4px; letter-spacing: -0.02em; }
    .series-desc { color: var(--sub-text); font-size: 0.88rem; margin: 0 0 14px; max-width: 520px; line-height: 1.4; }
    .sub-btn {
        border: none; border-radius: 9999px; padding: 9px 22px; font-size: 0.85rem;
        font-weight: 700; cursor: pointer; background: var(--accent); color: #fff; transition: opacity 0.15s;
    }
    .sub-btn:hover { opacity: 0.88; }
    .sub-btn.subscribed { background: var(--panel-bg-high); color: var(--text-color); border: 1px solid var(--border-color); }
    .series-settings-btn {
        background: var(--panel-bg); border: 1px solid var(--border-color); color: var(--text-color);
        border-radius: 9999px; padding: 8px 18px; font-size: 0.82rem; font-weight: 600; cursor: pointer; margin-left: 8px;
        transition: background 0.15s;
    }
    .series-settings-btn:hover { background: var(--panel-bg-high); }
    .modal-box textarea {
        width: 100%; min-height: 70px; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--border-color);
        background: var(--panel-bg); color: var(--text-color); font-size: 0.85rem; font-family: inherit; resize: vertical; outline: none;
    }
    .modal-box textarea:focus { border-color: var(--accent); }
    h2.section-title { font-size: 1.15rem; font-weight: 700; margin: 0 0 20px; letter-spacing: -0.01em; }
    .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 24px; }
    .video-card { text-decoration: none; color: var(--text-color); display: block; }
    .thumb-wrap { width: 100%; aspect-ratio: 16/9; border-radius: 1rem; overflow: hidden; background: var(--panel-bg); margin-bottom: 10px; }
    .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.3s; }
    .video-card:hover .thumb-wrap img { transform: scale(1.05); }
    .video-title { margin: 0; font-size: 0.9rem; font-weight: 600; line-height: 1.35; }
    .video-card:hover .video-title { color: var(--accent); }
    .video-title-row { display: flex; align-items: flex-start; gap: 4px; }
    .video-title-row .video-title { flex: 1; }
    .video-menu-btn {
        background: none; border: none; color: var(--sub-text); font-size: 1.1rem;
        cursor: pointer; padding: 0 4px; line-height: 1; flex-shrink: 0;
    }
    .video-menu-btn:hover { color: var(--text-color); }
    .empty-state { color: var(--sub-text); font-size: 0.9rem; padding: 20px 0; }

    .modal-overlay {
        display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55);
        backdrop-filter: blur(3px);
        z-index: 2000; align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
        background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--border-color);
        color: var(--text-color); width: 92%; max-width: 420px;
        max-height: 85vh; overflow-y: auto; border-radius: 20px; padding: 24px; position: relative;
    }
    .modal-close {
        position: absolute; top: 16px; right: 18px;
        background: none; border: none; font-size: 18px; cursor: pointer; color: var(--sub-text);
    }
    .modal-box h3 { font-size: 0.95rem; font-weight: 700; margin: 0 0 8px; }
    .modal-box label { display: block; font-size: 0.8rem; color: var(--sub-text); margin: 10px 0 5px; }
    .modal-box input[type="text"], .modal-box input[type="url"] {
        width: 100%; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--border-color);
        background: var(--panel-bg); color: var(--text-color); font-size: 0.85rem; outline: none;
    }
    .modal-box input:focus { border-color: var(--accent); }
    .modal-box button.action {
        margin-top: 16px; background: var(--accent); color: #fff; border: none;
        border-radius: 10px; padding: 10px 18px; font-size: 0.85rem; font-weight: 700; cursor: pointer;
    }
    .modal-box button.action.danger { background: transparent; border: 1px solid #c0392b; color: #e57373; }
    .modal-msg { font-size: 0.8rem; margin-top: 10px; }
    .modal-msg.ok { color: #4ade80; }
    .modal-msg.err { color: #e57373; }
</style>
</head>
<body>

<header>
    <a href="video.html" class="back">← HYUNIL VIDEO</a>
</header>

<div class="content">
    <div class="series-header" id="series-header">
        <div class="empty-state">불러오는 중...</div>
    </div>
    <h2 class="section-title">업로드된 영상</h2>
    <div class="video-grid" id="video-grid"></div>
</div>

<div class="modal-overlay" id="edit-series-modal">
    <div class="modal-box">
        <button class="modal-close" data-close="edit-series-modal">✕</button>
        <h3>시리즈 설정</h3>
        <label>시리즈 이름</label>
        <input type="text" id="edit-series-name">
        <label>썸네일(아이콘) 이미지 URL</label>
        <input type="url" id="edit-series-thumb">
        <label>설명 (시리즈 이름 아래 작게 표시됩니다 — URL이나 소개 글 등)</label>
        <textarea id="edit-series-desc" rows="3"></textarea>
        <button class="action" id="edit-series-save">저장</button>
        <div class="modal-msg" id="edit-series-msg"></div>
    </div>
</div>

<div class="modal-overlay" id="edit-video-modal">
    <div class="modal-box">
        <button class="modal-close" data-close="edit-video-modal">✕</button>
        <h3>영상 설정</h3>
        <label>제목</label>
        <input type="text" id="edit-video-title">
        <label>썸네일 이미지 URL</label>
        <input type="url" id="edit-video-thumb">
        <label>업로드 날짜</label>
        <input type="text" id="edit-video-date" disabled>
        <button class="action" id="edit-video-save">저장</button>
        <button class="action danger" id="edit-video-delete" style="margin-left: 8px;">영상 삭제</button>
        <div class="modal-msg" id="edit-video-msg"></div>
    </div>
</div>

<script>
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
</script>

<script type="module">
    import {
        watchAuth, signInWithGoogle, getSeries, getVideosForSeries,
        getUserDoc, subscribeToSeries, unsubscribeFromSeries,
        canUploadToSeries, isSiteOwner, updateVideo, deleteVideoFromSeries, formatDate, updateSeries
    } from './auth.js';

    const params = new URLSearchParams(location.search);
    const seriesId = params.get('id');
    const headerEl = document.getElementById('series-header');
    const gridEl = document.getElementById('video-grid');

    let currentUser = null;
    let currentSubs = [];
    let series = null;

    function renderHeader() {
        if (!series) return;
        const isSub = currentSubs.includes(seriesId);
        const canManageSeries = currentUser && (isSiteOwner(currentUser.email) || canUploadToSeries(series, currentUser.email));
        headerEl.innerHTML = `
            <div class="avatar">${series.thumbnail ? `<img src="${series.thumbnail}">` : series.name[0]}</div>
            <div>
                <div class="series-name">${series.name}</div>
                <div class="series-desc">${series.description || ''}</div>
                <button class="sub-btn ${isSub ? 'subscribed' : ''}" id="sub-btn">${isSub ? '구독중' : '구독'}</button>
                ${canManageSeries ? '<button class="series-settings-btn" id="series-settings-btn">시리즈 설정</button>' : ''}
            </div>
        `;
        document.getElementById('sub-btn').addEventListener('click', async () => {
            if (!currentUser) {
                try { await signInWithGoogle(); } catch (e) { return; }
            }
            if (currentSubs.includes(seriesId)) {
                await unsubscribeFromSeries(currentUser.uid, seriesId);
                currentSubs = currentSubs.filter(id => id !== seriesId);
            } else {
                await subscribeToSeries(currentUser.uid, seriesId);
                currentSubs.push(seriesId);
            }
            renderHeader();
        });
        const settingsBtn = document.getElementById('series-settings-btn');
        if (settingsBtn) {
            settingsBtn.addEventListener('click', () => openEditSeriesModal());
        }
    }

    function openEditSeriesModal() {
        document.getElementById('edit-series-name').value = series.name || '';
        document.getElementById('edit-series-thumb').value = series.thumbnail || '';
        document.getElementById('edit-series-desc').value = series.description || '';
        document.getElementById('edit-series-msg').textContent = '';
        document.getElementById('edit-series-modal').classList.add('open');
    }

    document.getElementById('edit-series-save').addEventListener('click', async () => {
        const name = document.getElementById('edit-series-name').value.trim();
        const thumbnail = document.getElementById('edit-series-thumb').value.trim();
        const description = document.getElementById('edit-series-desc').value.trim();
        const msg = document.getElementById('edit-series-msg');
        if (!name) { msg.textContent = '시리즈 이름을 입력해주세요.'; msg.className = 'modal-msg err'; return; }
        try {
            await updateSeries(seriesId, { name, thumbnail, description });
        } catch (e) {
            msg.textContent = '오류: ' + e.message; msg.className = 'modal-msg err';
            return;
        }
        msg.textContent = '저장되었습니다!'; msg.className = 'modal-msg ok';
        series.name = name;
        series.thumbnail = thumbnail;
        series.description = description;
        renderHeader();
    });

    async function renderVideos() {
        let videos = [];
        try {
            videos = await getVideosForSeries(seriesId);
        } catch (e) {
            console.error(e);
            gridEl.innerHTML = '<div class="empty-state">영상을 불러오지 못했습니다.</div>';
            return;
        }
        if (videos.length === 0) {
            gridEl.innerHTML = '<div class="empty-state">아직 업로드된 영상이 없습니다.</div>';
            return;
        }
        const canManage = currentUser && (isSiteOwner(currentUser.email) || canUploadToSeries(series, currentUser.email));
        gridEl.innerHTML = videos.map(v => `
            <a class="video-card" href="watch.html?s=${seriesId}&v=${v.id}">
                <div class="thumb-wrap"><img src="${v.thumbnailUrl}" alt="${v.title}"></div>
                <div class="video-title-row">
                    <div class="video-title">${v.title}</div>
                    ${canManage ? `<button class="video-menu-btn" data-video="${v.id}" data-title="${(v.title || '').replace(/"/g, '&quot;')}" data-thumb="${(v.thumbnailUrl || '').replace(/"/g, '&quot;')}">⋮</button>` : ''}
                </div>
            </a>
        `).join('');

        gridEl.querySelectorAll('.video-menu-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                openEditVideoModal(btn.dataset.video, btn.dataset.title, btn.dataset.thumb);
            });
        });
    }

    document.querySelectorAll('.modal-close').forEach(btn => {
        btn.addEventListener('click', () => {
            document.getElementById(btn.dataset.close).classList.remove('open');
        });
    });
    document.querySelectorAll('.modal-overlay').forEach(overlay => {
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) overlay.classList.remove('open');
        });
    });

    let editingVideoId = null;

    function openEditVideoModal(videoId, title, thumbnailUrl) {
        editingVideoId = videoId;
        document.getElementById('edit-video-title').value = title || '';
        document.getElementById('edit-video-thumb').value = thumbnailUrl || '';
        document.getElementById('edit-video-date').value = '불러오는 중...';
        document.getElementById('edit-video-msg').textContent = '';
        document.getElementById('edit-video-modal').classList.add('open');
        getVideosForSeries(seriesId).then(vids => {
            const v = vids.find(x => x.id === videoId);
            document.getElementById('edit-video-date').value = v ? (formatDate(v.createdAt) || '알 수 없음') : '알 수 없음';
        }).catch(() => {
            document.getElementById('edit-video-date').value = '알 수 없음';
        });
    }

    document.getElementById('edit-video-save').addEventListener('click', async () => {
        const title = document.getElementById('edit-video-title').value.trim();
        const thumbnailUrl = document.getElementById('edit-video-thumb').value.trim();
        const msg = document.getElementById('edit-video-msg');
        if (!title || !thumbnailUrl) { msg.textContent = '제목과 썸네일 URL을 입력해주세요.'; msg.className = 'modal-msg err'; return; }
        try {
            await updateVideo(seriesId, editingVideoId, { title, thumbnailUrl });
        } catch (e) {
            msg.textContent = '오류: ' + e.message; msg.className = 'modal-msg err';
            return;
        }
        msg.textContent = '저장되었습니다!'; msg.className = 'modal-msg ok';
        try { await renderVideos(); } catch (e) { console.error(e); }
    });

    document.getElementById('edit-video-delete').addEventListener('click', async () => {
        const msg = document.getElementById('edit-video-msg');
        if (!confirm('이 영상을 삭제할까요? 되돌릴 수 없습니다.')) return;
        try {
            await deleteVideoFromSeries(seriesId, editingVideoId);
        } catch (e) {
            msg.textContent = '오류: ' + e.message; msg.className = 'modal-msg err';
            return;
        }
        msg.textContent = '삭제되었습니다.'; msg.className = 'modal-msg ok';
        document.getElementById('edit-video-modal').classList.remove('open');
        try { await renderVideos(); } catch (e) { console.error(e); }
    });

    async function init() {
        if (!seriesId) {
            headerEl.innerHTML = '<div class="empty-state">시리즈 ID가 없습니다.</div>';
            return;
        }
        series = await getSeries(seriesId);
        if (!series) {
            headerEl.innerHTML = '<div class="empty-state">존재하지 않는 시리즈입니다.</div>';
            return;
        }
        renderHeader();
        try { await renderVideos(); } catch (e) { console.error(e); }
    }

    watchAuth(async (user) => {
        currentUser = user;
        if (user) {
            const userDoc = await getUserDoc(user.uid);
            currentSubs = (userDoc && userDoc.subscriptions) || [];
        } else {
            currentSubs = [];
        }
        renderHeader();
        if (series) {
            try { await renderVideos(); } catch (e) { console.error(e); }
        }
    });

    init();
</script>
</body>
</html>
