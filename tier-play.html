<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>티어 매기기 - HYUNIL TIER</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tier.css">
</head>
<body>

<span class="version-tag">beta 1.1.5</span>

<header>
    <a href="index.html" class="home-link" title="신현일의 Search 홈으로 가기">
        <span class="logo-stack">
            <span class="logo-top-line"><span>신</span><span>현</span><span>일</span><span>의</span></span>
            <span class="logo-bottom-line">Search</span>
        </span>
    </a>
    <span class="header-divider"></span>
    <a href="tier.html" class="tier-badge-link" title="HYUNIL TIER 홈으로 가기">
        <span class="tier-badge-text">Hyunil <em>Tier</em></span>
    </a>

    <div class="header-right">
        <a class="ghost-btn" href="tier.html">목록으로</a>
        <button class="login-btn" id="login-btn">로그인</button>
        <div class="user-area" id="user-area">
            <button class="profile-btn" id="profile-btn">
                <img id="user-photo" src="" alt="프로필">
                <span id="user-name"></span>
            </button>
            <button class="logout-btn" id="logout-btn">로그아웃</button>
        </div>
    </div>
</header>

<div class="content">
    <div class="board-head" id="board-head" style="display:none;">
        <h1 class="board-title" id="board-title"></h1>
        <p class="board-sub" id="board-sub"></p>
    </div>

    <div class="tier-board" id="tier-board" style="display:none;"></div>

    <div class="tray-head" id="tray-head" style="display:none;">
        <h3>아직 안 넣은 박스 <span id="tray-count"></span></h3>
        <span class="tray-hint">박스를 끌어서 원하는 티어 칸에 넣으세요. 다시 여기로 끌어오면 빼낼 수 있습니다.</span>
    </div>
    <div class="tier-tray" id="tray" data-zone="tray" style="display:none;"></div>

    <div class="board-actions" id="play-actions" style="display:none;">
        <button class="action ghost" id="reset-btn">전부 다시 빼기</button>
        <!-- 만든 사람(또는 티어표 관리 권한이 있는 계정)에게만 보임. 줄의 맨 오른쪽에 붙는다 -->
        <a class="action ghost push-right" id="edit-link" href="#" style="display:none;">티어표 수정</a>
    </div>

    <div class="empty-state" id="state-msg">불러오는 중...</div>
</div>

<script>
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
</script>

<script type="module">
    // ============================================================
    // tier-play.html — 남이 만든 티어표를 직접 매겨보는 화면
    //
    // 드래그는 HTML5 drag&drop 대신 포인터 이벤트(pointerdown/move/up)로 직접 구현했다.
    // HTML5 방식은 모바일 터치에서 아예 동작하지 않기 때문. 박스에 touch-action:none을
    // 걸어둬서(tier.css) 끄는 동안 화면이 같이 스크롤되지 않는다.
    //
    // 배치 결과는 브라우저(localStorage)에만 저장된다. 새로고침해도 남아 있지만
    // 다른 기기나 다른 사람에게는 보이지 않는다. (결과 공유는 아직 미구현)
    // ============================================================
    import {
        watchAuth, signInWithGoogle, signOutUser,
        getTier, incrementTierPlay, canEditTier, canUserManageTiers, textFillRatio,
        getTierCreatorLabel
    } from './auth.js';

    const loginBtn = document.getElementById('login-btn');
    const userArea = document.getElementById('user-area');
    const userPhoto = document.getElementById('user-photo');
    const userName = document.getElementById('user-name');
    const logoutBtn = document.getElementById('logout-btn');
    const editLink = document.getElementById('edit-link');

    const boardHead = document.getElementById('board-head');
    const boardTitle = document.getElementById('board-title');
    const boardSub = document.getElementById('board-sub');
    const board = document.getElementById('tier-board');
    const trayHead = document.getElementById('tray-head');
    const trayCount = document.getElementById('tray-count');
    const tray = document.getElementById('tray');
    const playActions = document.getElementById('play-actions');
    const resetBtn = document.getElementById('reset-btn');
    const stateMsg = document.getElementById('state-msg');

    const tierId = new URLSearchParams(location.search).get('id');
    let tier = null;
    let currentUser = null;
    let iCanManageTiers = false;
    let itemsById = {};
    let rows = [];
    let rowItems = [];   // rowItems[행 번호] = [박스 id, ...]
    let trayItems = [];  // 아직 어느 칸에도 안 넣은 박스 id 목록

    const storageKey = () => `hyunil-tier-progress:${tierId}`;

    function escapeHtml(str) {
        return String(str || '').replace(/[&<>"']/g, (c) => (
            { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
        ));
    }

    loginBtn.addEventListener('click', async () => {
        try { await signInWithGoogle(); }
        catch (err) { alert('로그인에 실패했습니다: ' + err.message); }
    });
    logoutBtn.addEventListener('click', () => signOutUser());

    // ---------- 저장 / 불러오기 (이 브라우저에만) ----------
    function saveProgress() {
        try { localStorage.setItem(storageKey(), JSON.stringify({ rowItems, trayItems })); }
        catch (e) { /* 저장 공간이 없으면 그냥 넘어감 */ }
    }
    function loadProgress() {
        try {
            const raw = localStorage.getItem(storageKey());
            if (!raw) return false;
            const saved = JSON.parse(raw);
            if (!saved || !Array.isArray(saved.rowItems)) return false;

            // 티어표가 수정돼서 박스가 늘거나 줄었을 수 있으니 지금 있는 박스만 남긴다
            const valid = new Set(Object.keys(itemsById));
            const used = new Set();
            rowItems = rows.map((_, i) => (saved.rowItems[i] || []).filter(id => {
                if (!valid.has(id) || used.has(id)) return false;
                used.add(id); return true;
            }));
            // 보관함은 저장해둔 순서를 먼저 살리고, 그 뒤에 새로 추가된 박스를 이어붙인다
            const savedTray = (saved.trayItems || []).filter(id => {
                if (!valid.has(id) || used.has(id)) return false;
                used.add(id); return true;
            });
            trayItems = savedTray.concat(Object.keys(itemsById).filter(id => !used.has(id)));
            return true;
        } catch (e) { return false; }
    }

    // ---------- 그리기 ----------
    // 이미지 URL이 없는 박스는 박스 이름 글자로 미리보기를 채운다
    function itemHtml(id) {
        const it = itemsById[id];
        if (!it) return '';
        let inner, label;
        if (it.imageUrl) {
            inner = `<div class="item-img"><img src="${escapeHtml(it.imageUrl)}" alt="" draggable="false"></div>`;
            label = escapeHtml(it.name || '');
        } else {
            const ratio = textFillRatio(it.name || '?');
            inner = `<div class="item-img text-fill" style="font-size:calc(var(--box-size) * ${ratio})">${escapeHtml(it.name || '?')}</div>`;
            label = '';   // 글자로 채운 경우 아래에 같은 이름을 또 쓰지 않음
        }
        return `
            <div class="tier-item" data-id="${escapeHtml(id)}" title="${escapeHtml(it.name || '')}">
                ${inner}
                <span class="item-name">${label}</span>
            </div>`;
    }

    function render() {
        board.innerHTML = rows.map((r, i) => `
            <div class="tier-row">
                <div class="tier-label" style="background:${escapeHtml(r.color || '#cfcfcf')}">${escapeHtml(r.label || '')}</div>
                <div class="tier-drop" data-zone="row-${i}">${(rowItems[i] || []).map(itemHtml).join('')}</div>
            </div>
        `).join('');
        tray.innerHTML = trayItems.map(itemHtml).join('');
        tray.dataset.zone = 'tray';
        trayCount.textContent = `(${trayItems.length}개)`;
        saveProgress();
    }

    resetBtn.addEventListener('click', () => {
        rowItems = rows.map(() => []);
        trayItems = (tier.items || []).map(it => it.id);
        render();
    });

    // ============================================================
    // 드래그 (포인터 이벤트 기반)
    // ============================================================
    let drag = null;   // { id, source, ghost, startX, startY, active }
    const DRAG_THRESHOLD = 5;   // 이만큼 움직여야 "끌기"로 인정 (그냥 탭한 걸 드래그로 오해하지 않도록)

    document.addEventListener('pointerdown', (e) => {
        const el = e.target.closest('.tier-item');
        if (!el || !el.dataset.id) return;
        if (e.button !== undefined && e.button !== 0) return;   // 마우스는 왼쪽 버튼만
        drag = {
            id: el.dataset.id,
            el,
            startX: e.clientX,
            startY: e.clientY,
            active: false,
            ghost: null,
            pointerId: e.pointerId,
        };
        el.setPointerCapture(e.pointerId);
    });

    document.addEventListener('pointermove', (e) => {
        if (!drag || e.pointerId !== drag.pointerId) return;

        if (!drag.active) {
            const moved = Math.hypot(e.clientX - drag.startX, e.clientY - drag.startY);
            if (moved < DRAG_THRESHOLD) return;
            startDragging(e);
        }
        e.preventDefault();

        drag.ghost.style.left = e.clientX + 'px';
        drag.ghost.style.top = e.clientY + 'px';
        highlightZone(zoneAt(e.clientX, e.clientY));
    }, { passive: false });

    document.addEventListener('pointerup', (e) => {
        if (!drag || e.pointerId !== drag.pointerId) return;
        if (drag.active) {
            const zone = zoneAt(e.clientX, e.clientY);
            if (zone) dropInto(zone, e.clientX, e.clientY);
            cleanupDrag();
            render();
        } else {
            cleanupDrag();
        }
    });
    document.addEventListener('pointercancel', () => { if (drag) { cleanupDrag(); render(); } });

    function startDragging(e) {
        drag.active = true;
        drag.el.classList.add('dragging');

        const ghost = drag.el.cloneNode(true);
        ghost.classList.remove('dragging');
        ghost.classList.add('drag-ghost');
        ghost.style.width = drag.el.offsetWidth + 'px';
        ghost.style.left = e.clientX + 'px';
        ghost.style.top = e.clientY + 'px';
        document.body.appendChild(ghost);
        drag.ghost = ghost;
    }

    function cleanupDrag() {
        if (!drag) return;
        if (drag.ghost) drag.ghost.remove();
        if (drag.el) drag.el.classList.remove('dragging');
        clearHighlights();
        drag = null;
    }

    // 화면 좌표에 있는 드롭 가능 영역 찾기 (고스트는 pointer-events:none 이라 잡히지 않음)
    function zoneAt(x, y) {
        const el = document.elementFromPoint(x, y);
        return el ? el.closest('.tier-drop, .tier-tray') : null;
    }
    function clearHighlights() {
        document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
    }
    function highlightZone(zone) {
        clearHighlights();
        if (zone) zone.classList.add('drag-over');
    }

    // 놓은 위치를 보고 몇 번째에 끼워 넣을지 계산
    function insertIndexIn(zone, x, y, excludeId) {
        const kids = Array.from(zone.querySelectorAll('.tier-item')).filter(k => k.dataset.id !== excludeId);
        for (let i = 0; i < kids.length; i++) {
            const r = kids[i].getBoundingClientRect();
            if (y < r.bottom && x < r.left + r.width / 2) return i;
        }
        return kids.length;
    }

    function removeFromAll(id) {
        rowItems = rowItems.map(list => list.filter(v => v !== id));
        trayItems = trayItems.filter(v => v !== id);
    }

    function dropInto(zone, x, y) {
        const id = drag.id;
        const index = insertIndexIn(zone, x, y, id);
        removeFromAll(id);
        const zoneName = zone.dataset.zone;
        if (zoneName === 'tray') {
            trayItems.splice(index, 0, id);
        } else {
            const i = Number(zoneName.split('-')[1]);
            if (!rowItems[i]) rowItems[i] = [];
            rowItems[i].splice(index, 0, id);
        }
    }

    // 이미지 자체를 브라우저가 끌어가는 기본 동작을 막음
    document.addEventListener('dragstart', (e) => {
        if (e.target.closest('.tier-item')) e.preventDefault();
    });

    // ============================================================
    // 시작
    // ============================================================
    async function load() {
        if (!tierId) { stateMsg.textContent = '주소에 티어표 번호가 없습니다.'; return; }
        try {
            tier = await getTier(tierId);
        } catch (err) {
            console.error(err);
            stateMsg.textContent = '티어표를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.';
            return;
        }
        if (!tier) { stateMsg.textContent = '없는 티어표입니다.'; return; }

        rows = (tier.rows && tier.rows.length) ? tier.rows : [
            { label: 'S', color: '#ff7f7f' }, { label: 'A', color: '#ffbf7f' },
            { label: 'B', color: '#ffdf7f' }, { label: 'C', color: '#ffff7f' },
        ];
        itemsById = {};
        (tier.items || []).forEach((it, i) => {
            const id = it.id || ('i' + i);
            itemsById[id] = { ...it, id };
        });

        rowItems = rows.map(() => []);
        trayItems = Object.keys(itemsById);
        loadProgress();

        boardTitle.textContent = tier.title || '제목 없음';
        renderBoardSub();
        document.title = `${tier.title || '티어표'} - HYUNIL TIER`;

        stateMsg.style.display = 'none';
        boardHead.style.display = 'block';
        board.style.display = 'block';
        trayHead.style.display = 'flex';
        tray.style.display = 'flex';
        playActions.style.display = 'flex';
        render();

        updateEditLink();

        // 열어본 횟수 +1 (실패해도 화면에는 영향 없음)
        incrementTierPlay(tierId).catch(() => {});
    }
    load();

    // 티어표 설명 줄. 익명 업로드면 "익명"으로 보이고, 관리자가 로그인했을 때만
    // 실제 만든이가 괄호로 함께 보인다. 로그인 여부가 나중에 바뀔 수 있어서
    // load() 이후와 watchAuth 콜백 양쪽에서 다시 불러준다.
    function renderBoardSub() {
        if (!tier) return;
        boardSub.textContent = [
            tier.description,
            `${getTierCreatorLabel(tier, currentUser ? currentUser.email : null)} 만듦`,
            `박스 ${Object.keys(itemsById).length}개`
        ].filter(Boolean).join(' · ');
    }

    // 만든 사람(또는 관리자)에게만 "고치기" 버튼을 보여준다.
    // 로그인 확인과 티어표 불러오기는 서로 순서를 보장할 수 없어서, 둘 다 끝난 뒤 다시 확인한다.
    function updateEditLink() {
        if (tier && currentUser && canEditTier(tier, currentUser.email, iCanManageTiers)) {
            editLink.href = `tier-make.html?id=${encodeURIComponent(tierId)}`;
            editLink.style.display = 'inline-block';
        } else {
            editLink.style.display = 'none';
        }
    }

    watchAuth(async (user) => {
        currentUser = user;
        if (user) {
            loginBtn.style.display = 'none';
            userArea.style.display = 'flex';
            userPhoto.src = user.photoURL || '';
            userName.textContent = user.displayName || user.email;
            try { iCanManageTiers = await canUserManageTiers(user.email); }
            catch (e) { iCanManageTiers = false; }
        } else {
            loginBtn.style.display = 'inline-block';
            userArea.style.display = 'none';
            iCanManageTiers = false;
        }
        updateEditLink();
        renderBoardSub();
    });
</script>

</body>
</html>
