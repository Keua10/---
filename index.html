<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>신현일의 이모저모 검색엔진</title>
    
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #202124;
            --link-color: #4285F4;
            --input-border: #dfe1e5;
            --btn-bg: #f8f9fa;
            --switch-bg: #e5e5e5;
            --icon-color: #9aa0a6;
        }

        [data-theme="dark"] {
            --bg-color: #181818;
            --text-color: #f1f3f4;
            --link-color: #8ab4f8;
            --input-border: #3c4043;
            --btn-bg: #303134;
            --switch-bg: #444;
            --icon-color: #9aa0a6;
        }
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Malgun Gothic', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.4s, color 0.4s;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            justify-content: flex-start;
            padding-top: 20vh;
            box-sizing: border-box;
        }

        .top-left-controls {
            position: absolute;
            top: 25px;
            left: 25px;
            z-index: 1000;
        }

        .top-right-controls {
            position: absolute;
            top: 25px;
            right: 25px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 18px;
            font-size: 14px;
        }

        .login-btn {
            background-color: var(--link-color);
            color: #fff;
            border: none;
            border-radius: 18px;
            padding: 8px 18px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .user-area {
            display: none;
            align-items: center;
            gap: 10px;
        }
        .user-area img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
        }
        .logout-btn {
            background: var(--btn-bg);
            border: 1px solid var(--input-border);
            border-radius: 16px;
            padding: 6px 14px;
            font-size: 13px;
            color: var(--text-color);
            cursor: pointer;
        }

        /* 모바일에서는 상단 우측 영역을 조금 줄임 */
        @media (max-width: 600px) {
            .top-right-controls { gap: 10px; font-size: 12px; }
            .login-btn { padding: 6px 12px; }
        }

        .theme-switch {
            display: inline-block;
            width: 55px;
            height: 30px;
            position: relative;
        }

        .theme-switch input { display: none; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--switch-bg);
            border-radius: 30px;
            transition: 0.4s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .slider:before {
            position: absolute;
            content: "☀️";
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            height: 22px;
            width: 22px;
            left: 4px;
            bottom: 4px;
            background-color: #87CEEB;
            border-radius: 50%;
            transition: 0.4s;
        }

        input:checked + .slider:before {
            transform: translateX(25px);
            content: "🌙";
            background-color: #000080;
            color: white;
        }

        .live-link {
            margin-bottom: 25px;
            color: var(--link-color);
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }

        .search-container {
            text-align: center;
            width: 100%;
            max-width: 580px;
            padding: 0 24px; /* 모바일 대응 양옆 여백 확보 */
            box-sizing: border-box;
        }

        .logo {
            font-size: 3.5rem;
            font-weight: bold;
            margin-bottom: 35px;
            letter-spacing: -1.5px;
        }
        .logo span:nth-child(1) { color: #4285F4; }
        .logo span:nth-child(2) { color: #EA4335; }
        .logo span:nth-child(3) { color: #FBBC05; }
        .logo span:nth-child(4) { color: #34A853; }
        .logo span:nth-child(5) { color: var(--text-color); font-size: 2.5rem; margin-left: 5px; }

        .search-box-wrapper {
            position: relative;
            width: 100%;
            height: 48px;
            margin-bottom: 30px;
            background-color: var(--bg-color);
            border: 1px solid var(--input-border);
            border-radius: 24px;
            box-shadow: 0 1px 6px rgba(32,33,36,0.1);
            transition: box-shadow 0.2s;
            box-sizing: border-box;
            display: flex;
            align-items: center;
        }

        .search-box-wrapper:focus-within {
            box-shadow: 0 1px 8px rgba(32,33,36,0.2);
        }

        .search-icon-left {
            position: absolute;
            left: 18px;
            font-size: 18px;
            color: var(--icon-color);
            pointer-events: none;
            top: 50%;
            transform: translateY(calc(-50% - 2px));
        }

        .camera-icon-right {
            position: absolute;
            right: 18px;
            font-size: 20px;
            text-decoration: none;
            cursor: pointer;
            top: 50%;
            transform: translateY(calc(-50% - 2px));
            transition: transform 0.2s;
        }
        
        .camera-icon-right:hover { 
            transform: translateY(calc(-50% - 2px)) scale(1.15); 
        }

        .search-box-wrapper input {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
            outline: none;
            font-size: 16px;
            color: var(--text-color);
            padding: 0 50px 0 45px;
            box-sizing: border-box;
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .btn {
            background-color: var(--btn-bg);
            border: 1px solid var(--btn-bg);
            border-radius: 4px;
            color: var(--text-color);
            font-size: 14px;
            padding: 0 16px;
            line-height: 36px;
            height: 36px;
            min-width: 54px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            border: 1px solid #dadce0;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        /* ===== 프로필 상세창 (계정 정보 + 앱 런처) ===== */
        :root {
            --popup-bg: #ffffff;
            --popup-border: #dfe1e5;
            --popup-inner-bg: #eef0f2;
            --popup-shadow: rgba(32,33,36,0.28);
            --sub-text: #5f6368;
            --cell-hover: rgba(0,0,0,0.06);
            /* 로고 아이콘을 감싸는 작은 칩 배경만 고정적으로 어둡게 함(로고의 흰 글자가
               항상 보이도록). 트레이(app-grid-wrap)와 라벨 글자는 테마를 그대로 따라가므로
               라이트/다크 전환 시 실제로 톤이 달라 보임 — "칩만 브랜드 색, 나머지는 테마 반응형" */
            --icon-chip-bg: #1c1c1e;
            --icon-chip-bg-hover: #2a2a2c;
        }
        [data-theme="dark"] {
            --popup-bg: #282828;
            --popup-border: #3c4043;
            --popup-inner-bg: #0f0f0f;
            --popup-shadow: rgba(0,0,0,0.65);
            --sub-text: #9aa0a6;
            --cell-hover: rgba(255,255,255,0.08);
            --icon-chip-bg: rgba(255,255,255,0.08);
            --icon-chip-bg-hover: rgba(255,255,255,0.14);
        }

        .user-area { position: relative; }

        .profile-trigger {
            display: flex;
            align-items: center;
            gap: 9px;
            background: transparent;
            border: none;
            padding: 4px 10px 4px 4px;
            border-radius: 20px;
            cursor: pointer;
            color: var(--text-color);
            font-family: inherit;
            font-size: 14px;
            transition: background 0.18s;
        }
        .profile-trigger:hover { background: var(--btn-bg); }
        .profile-trigger img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            background: var(--btn-bg);
        }

        .profile-popup {
            position: absolute;
            top: calc(100% + 12px);
            right: 0;
            width: 300px;
            max-width: calc(100vw - 32px);
            box-sizing: border-box;
            padding: 16px;
            background: var(--popup-bg);
            border: 1px solid var(--popup-border);
            border-radius: 16px;
            box-shadow: 0 10px 30px var(--popup-shadow);
            text-align: left;
            z-index: 1200;
            display: none;
        }
        .profile-popup.open { display: block; animation: popIn 0.16s ease-out; }
        @keyframes popIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: none; }
        }

        .popup-head { display: flex; align-items: center; gap: 12px; }
        .popup-head img {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            background: var(--btn-bg);
            flex-shrink: 0;
        }
        .popup-id { min-width: 0; }
        .popup-name { font-size: 15px; font-weight: 700; line-height: 1.25; }
        .popup-email {
            font-size: 12px;
            color: var(--sub-text);
            margin-top: 3px;
            word-break: break-all;
        }

        .popup-account-btn {
            display: block;
            width: 100%;
            margin-top: 14px;
            padding: 9px 0;
            background: transparent;
            color: var(--text-color);
            border: 1px solid var(--popup-border);
            border-radius: 20px;
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.18s, border-color 0.18s, transform 0.08s;
        }
        .popup-account-btn:hover { background: var(--btn-bg); border-color: var(--icon-color); }
        .popup-account-btn:active { transform: scale(0.98); }

        /* 앱 런처 영역 — 팝업 배경보다 어둡게 해서 공간 구분(트레이는 테마를 그대로 따라감) */
        .app-grid-wrap {
            margin-top: 14px;
            padding: 10px;
            background: var(--popup-inner-bg);
            border-radius: 12px;
            max-height: 300px;
            overflow-y: auto;
        }
        /* 빈 자리 없이 실제 앱만 나열 — 앱이 늘어나면 자동으로 다음 줄로 넘어감.
           gap을 라벨 글자 크기(11px)와 동일하게 줘서 "글자 크기만큼 간격" 요건을 만족 */
        .app-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 11px;
        }
        .app-cell {
            width: 76px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            flex-shrink: 0;
        }
        /* 로고 이미지를 감싸는 작은 칩만 고정 배경 — 셀 전체를 검게 칠하지 않음 */
        .app-icon-chip {
            width: 68px;
            height: 68px;
            border-radius: 17px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--icon-chip-bg);
            transition: background 0.15s;
        }
        a.app-cell:hover .app-icon-chip { background: var(--icon-chip-bg-hover); }
        /* 이미지 형태 앱 아이콘(투명 배경 로고 파일) — 칩 안을 꽉 채우도록 크게 표시
           (아이콘 원본 파일 자체를 여백 없이 다시 크롭해서 96%까지 올려도 칩 밖으로 안 넘침) */
        /* 이미지 형태 앱 아이콘(투명 배경 로고 파일) — 칩 안을 꽉 채우도록 크게 표시.
           ⚠️ 선택자를 반드시 `.app-icon-chip .app-icon-img`(클래스 2개)로 유지할 것.
           이 아이콘은 #user-area 안에 들어있어서, 위쪽의 `.user-area img { width:32px; height:32px; border-radius:50% }`
           규칙이 클래스 1개 + 태그 1개로 `.app-icon-img`(클래스 1개)보다 우선순위가 높아 32px로 덮어써버림.
           클래스를 2개로 만들어야 그 규칙을 이긴다. border-radius도 50%로 상속되므로 명시적으로 0으로 되돌림. */
        .app-icon-chip .app-icon-img {
            width: 96%;
            height: 96%;
            border-radius: 0;
            object-fit: contain;
            flex-shrink: 0;
        }
        /* 아직 전용 로고 이미지 파일이 없는 앱을 위한 글자 아이콘.
           위와 같은 이유로 선택자를 반드시 클래스 2개(.app-icon-chip .app-icon-text)로 유지할 것. */
        .app-icon-chip .app-icon-text {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 0 6px;
            font-size: 13px;
            font-weight: 800;
            line-height: 1.15;
            letter-spacing: -0.02em;
            text-align: center;
            color: #ffffff;
            white-space: pre-line;
        }
        .app-icon-chip .app-icon-text em { font-style: normal; color: #ff4d4d; }
        /* 라벨은 트레이 위에 직접 놓이므로 테마 글자색을 그대로 따라감(고정 흰색 아님) */
        .app-label {
            display: block;
            width: 76px;
            font-size: 11px;
            line-height: 1.2;
            text-align: center;
            color: var(--text-color);
            opacity: 0.88;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        @media (max-width: 600px) {
            .profile-trigger { font-size: 12px; padding: 3px 8px 3px 3px; }
            .profile-trigger img { width: 28px; height: 28px; }
            .profile-popup { width: 270px; padding: 14px; }
            .app-grid-wrap { max-height: 260px; }
            .app-grid { gap: 10px; }
            .app-cell { width: 66px; }
            .app-icon-chip { width: 58px; height: 58px; border-radius: 15px; }
            .app-label { width: 66px; font-size: 10px; }
        }
        /* 모바일 반응형 미세 스케일 조정 */
        @media (max-width: 600px) {
            body { padding-top: 15vh; }
            .logo { font-size: 2.3rem; margin-bottom: 25px; }
            .logo span:nth-child(5) { font-size: 1.8rem; }
            .search-box-wrapper { height: 46px; }
        }
        /* 우측 하단 버전 표시 — 눈에 띄지 않게 아주 작고 흐리게, 다른 요소를 가리지 않도록 클릭 통과 */
        .version-tag {
            position: fixed;
            right: 10px;
            bottom: 8px;
            font-size: 10px;
            color: var(--icon-color);
            opacity: 0.45;
            letter-spacing: 0.02em;
            pointer-events: none;
            z-index: 5;
            user-select: none;
        }
    </style>
</head>
<body>
    <span class="version-tag">beta 1.1.3</span>
    <div class="top-left-controls">
        <label class="theme-switch">
            <input type="checkbox" id="theme-checkbox">
            <div class="slider"></div>
        </label>
    </div>

    <div class="top-right-controls">
        <button class="login-btn" id="login-btn">로그인</button>
        <div class="user-area" id="user-area">
            <button class="profile-trigger" id="profile-trigger" aria-haspopup="true" aria-expanded="false">
                <img id="user-photo" src="" alt="프로필">
                <span id="user-name"></span>
            </button>
            <button class="logout-btn" id="logout-btn">로그아웃</button>

            <!-- 프로필 상세창 -->
            <div class="profile-popup" id="profile-popup">
                <div class="popup-head">
                    <img id="popup-photo" src="" alt="프로필">
                    <div class="popup-id">
                        <div class="popup-name" id="popup-name"></div>
                        <div class="popup-email" id="popup-email"></div>
                    </div>
                </div>

                <button class="popup-account-btn" id="popup-account-btn" type="button">계정 설정</button>

                <div class="app-grid-wrap">
                    <div class="app-grid" id="app-grid"></div>
                </div>
            </div>
        </div>
    </div>

    <a href="Untitled-2.html" class="live-link">신현일의 라이브 직캠을 지금 보세요!!</a>

    <div class="search-container">
        <div class="logo">
            <span>신</span><span>현</span><span>일</span><span>의</span><span>Search</span>
        </div>
        
        <form action="https://www.google.com/search" method="GET">
            <div class="search-box-wrapper">
                <span class="search-icon-left">🔍</span>
                <input type="text" id="search-input" name="q" placeholder="무엇이든 검색해보세요..." autofocus>
                <a href="hand_tracking.html" class="camera-icon-right" title="손 인식 카메라">📷</a>
            </div>
            
            <div class="button-group">
                <button type="submit" class="btn">Vibe 검색</button>
                <button type="button" class="btn" id="feeling-btn">Feeling Good!</button>
            </div>
        </form>
    </div>

    <script>
        const themeCheckbox = document.getElementById('theme-checkbox');
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        themeCheckbox.checked = (savedTheme === 'dark');

        themeCheckbox.addEventListener('change', (e) => {
            const theme = e.target.checked ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
        });

        const feelingBtn = document.getElementById('feeling-btn');
        const searchInput = document.getElementById('search-input');

        feelingBtn.addEventListener('click', () => {
            if (searchInput.value.trim().toLowerCase() === 'hyunil gravity') {
                window.location.href = 'gravity.html'; 
            } else {
                alert('오늘 하루도 기분 좋은 하루 되세요! 😍');
            }
        });
    </script>

    <script type="module">
        import { watchAuth, signInWithGoogle, signOutUser } from './auth.js';

        /* =========================================================
           신현일의 Search 하위 앱 목록
           앱이 추가되면 아래 APPS 배열에 { name, url, iconSrc }만 추가하면 됨.
           빈 칸 없이 실제 앱만 나열되고, 개수가 늘어나면 자동으로 줄바꿈됨.
           ========================================================= */
        const APPS = [
            {
                name: 'HYUNIL VIDEO',
                url: 'video.html',
                /* ?v= 뒤 숫자는 캐시 무효화용. 아이콘 이미지를 교체할 때마다 이 숫자를 1 올릴 것
                   (파일명이 같으면 브라우저/CDN이 옛날 이미지를 계속 쓰기 때문) */
                iconSrc: 'hyunil_video_icon.png?v=2'
            },
            {
                name: 'HYUNIL TIER',
                url: 'tier.html',
                /* 아직 로고 이미지가 없어서 글자 아이콘으로 대신함.
                   나중에 로고 PNG가 생기면 iconText를 지우고 iconSrc: 'hyunil_tier_icon.png?v=1' 로 바꾸면 됨 */
                iconText: 'Hyunil\n<em>Tier</em>'
            }
        ];

        const loginBtn = document.getElementById('login-btn');
        const userArea = document.getElementById('user-area');
        const userPhoto = document.getElementById('user-photo');
        const userName = document.getElementById('user-name');
        const logoutBtn = document.getElementById('logout-btn');
        const profileTrigger = document.getElementById('profile-trigger');
        const profilePopup = document.getElementById('profile-popup');
        const popupPhoto = document.getElementById('popup-photo');
        const popupName = document.getElementById('popup-name');
        const popupEmail = document.getElementById('popup-email');
        const popupAccountBtn = document.getElementById('popup-account-btn');
        const appGrid = document.getElementById('app-grid');

        function renderAppGrid() {
            appGrid.innerHTML = APPS.map(app => {
                // 로고 이미지가 있으면 이미지, 없으면 iconText 로 글자 아이콘을 그린다
                const icon = app.iconSrc
                    ? `<img class="app-icon-img" src="${app.iconSrc}" alt="${app.name}">`
                    : `<span class="app-icon-text">${app.iconText || app.name}</span>`;
                return `
                <a class="app-cell" href="${app.url}" title="${app.name}">
                    <span class="app-icon-chip">${icon}</span>
                    <span class="app-label">${app.name}</span>
                </a>`;
            }).join('');
        }
        renderAppGrid();

        function closePopup() {
            profilePopup.classList.remove('open');
            profileTrigger.setAttribute('aria-expanded', 'false');
        }

        profileTrigger.addEventListener('click', (e) => {
            e.stopPropagation();
            const willOpen = !profilePopup.classList.contains('open');
            profilePopup.classList.toggle('open', willOpen);
            profileTrigger.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
        });

        profilePopup.addEventListener('click', (e) => e.stopPropagation());
        document.addEventListener('click', closePopup);
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closePopup();
        });

        // 계정 설정 — 아직 기능 없음 (인터랙션만)
        popupAccountBtn.addEventListener('click', (e) => e.preventDefault());

        loginBtn.addEventListener('click', async () => {
            try {
                await signInWithGoogle();
            } catch (err) {
                console.error(err);
                alert('로그인에 실패했습니다: ' + err.message);
            }
        });

        logoutBtn.addEventListener('click', async () => {
            closePopup();
            await signOutUser();
        });

        watchAuth((user) => {
            if (user) {
                loginBtn.style.display = 'none';
                userArea.style.display = 'flex';
                const photo = user.photoURL || '';
                const nick = user.displayName || user.email;
                userPhoto.src = photo;
                userName.textContent = nick;
                popupPhoto.src = photo;
                popupName.textContent = nick;
                popupEmail.textContent = user.email || '';
            } else {
                loginBtn.style.display = 'inline-block';
                userArea.style.display = 'none';
                closePopup();
            }
        });
    </script>
</body>
</html>
