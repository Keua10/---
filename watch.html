<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영상 - HYUNIL VIDEO</title>
<style>
    :root {
        --bg-color: #ffffff; --panel-bg: #f8f9fa; --text-color: #202124;
        --sub-text: #606368; --border-color: #e5e5e5; --accent: #ff0000; --link-color: #4285F4;
    }
    [data-theme="dark"] {
        --bg-color: #181818; --panel-bg: #232323; --text-color: #f1f3f4;
        --sub-text: #aaaaaa; --border-color: #333; --accent: #ff4d4d; --link-color: #8ab4f8;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Malgun Gothic', sans-serif; background: var(--bg-color); color: var(--text-color); }

    .top-bar { padding: 18px 28px 0; }
    .back-btn {
        background: none; border: none; cursor: pointer; font-size: 1.3rem;
        color: var(--text-color); padding: 6px 10px; border-radius: 8px;
    }
    .back-btn:hover { background: var(--panel-bg); }

    .watch-layout {
        display: flex; gap: 32px; padding: 12px 28px 40px; align-items: flex-start;
    }
    .watch-main { flex: 1; min-width: 0; max-width: 900px; }

    .thumb-container {
        position: relative; width: 100%; aspect-ratio: 16/9; border-radius: 24px;
        overflow: hidden; background: #000; cursor: pointer;
    }
    .thumb-container img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0.85; }
    .watch-btn {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        background: rgba(0,0,0,0.35); border: 2px solid #fff; color: #fff;
        font-size: 1.1rem; font-weight: bold; padding: 14px 34px; border-radius: 6px;
        pointer-events: none;
    }
    .thumb-menu-btn {
        position: absolute; bottom: 12px; right: 14px; background: rgba(0,0,0,0.4);
        border: none; color: #fff; font-size: 1.2rem; width: 32px; height: 32px; border-radius: 50%;
        cursor: pointer; line-height: 1;
    }
    .thumb-menu-btn:hover { background: rgba(0,0,0,0.6); }

    .series-row { display: flex; align-items: center; gap: 8px; margin-top: 16px; text-decoration: none; color: var(--text-color); width: fit-content; }
    .series-row .mini-avatar {
        width: 26px; height: 26px; border-radius: 50%; background: var(--panel-bg);
        display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: bold;
        overflow: hidden; flex-shrink: 0; border: 1px solid var(--border-color);
    }
    .series-row .mini-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .series-row .series-row-name { font-size: 0.85rem; color: var(--sub-text); }

    .watch-title { font-size: 1.4rem; font-weight: bold; margin: 10px 0 8px; line-height: 1.3; }

    .watch-stats { display: flex; align-items: center; gap: 20px; font-size: 0.95rem; }
    .stat-btn {
        background: none; border: none; cursor: pointer; display: flex; align-items: center; gap: 6px;
        font-size: 0.95rem; color: var(--text-color); padding: 4px 2px;
    }
    .stat-btn.liked { color: var(--accent); font-weight: bold; }
    .stat-static { display: flex; align-items: center; gap: 6px; color: var(--text-color); }

    .watch-side { width: 340px; flex-shrink: 0; }
    .comments-header { font-size: 1.05rem; font-weight: bold; margin-bottom: 14px; }
    .comments-header span { color: var(--sub-text); font-weight: normal; font-size: 0.9rem; }

    .comment-form { margin-bottom: 18px; }
    .comment-form textarea {
        width: 100%; min-height: 60px; border-radius: 8px; border: 1px solid var(--border-color);
        background: var(--panel-bg); color: var(--text-color); padding: 8px 10px; font-size: 0.85rem;
        resize: vertical; font-family: inherit;
    }
    .comment-form-actions { display: flex; gap: 8px; margin-top: 6px; }
    .comment-form button {
        border: none; border-radius: 8px; padding: 7px 14px; font-size: 0.82rem; font-weight: bold; cursor: pointer;
    }
    .comment-form .save-btn { background: var(--link-color); color: #fff; }
    .comment-form .delete-btn { background: #c0392b; color: #fff; }
    .comment-hint { font-size: 0.8rem; color: var(--sub-text); margin-bottom: 14px; }

    .comment-item { padding: 10px 0; border-bottom: 1px solid var(--border-color); }
    .comment-item:last-child { border-bottom: none; }
    .comment-nickname { font-weight: bold; font-size: 0.9rem; }
    .comment-text { font-size: 0.85rem; margin: 4px 0 6px; line-height: 1.4; white-space: pre-wrap; }
    .comment-like-btn {
        background: none; border: none; cursor: pointer; font-size: 0.8rem; color: var(--sub-text);
        display: inline-flex; align-items: center; gap: 4px; padding: 2px 0;
    }
    .comment-like-btn.liked { color: var(--accent); font-weight: bold; }
    .empty-state { color: var(--sub-text); font-size: 0.85rem; padding: 12px 0; }

    @media (max-width: 900px) {
        .watch-layout { flex-direction: column; }
        .watch-side { width: 100%; }
    }
</style>
</head>
<body>

<div class="top-bar">
    <button class="back-btn" id="back-btn" title="뒤로가기">←</button>
</div>

<div class="watch-layout">
    <div class="watch-main" id="watch-main">
        <div class="empty-state">불러오는 중...</div>
    </div>
    <div class="watch-side">
        <div class="comments-header" id="comments-header">댓글</div>
        <div id="comment-form-wrap"></div>
        <div id="comments-list"><div class="empty-state">불러오는 중...</div></div>
    </div>
</div>

<div id="edit-video-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:2000; align-items:center; justify-content:center;">
    <div style="background: var(--bg-color); color: var(--text-color); width: 92%; max-width: 420px; max-height: 85vh; overflow-y:auto; border-radius:14px; padding:22px; position:relative;">
        <button id="edit-video-close" style="position:absolute; top:14px; right:16px; background:none; border:none; font-size:18px; cursor:pointer; color:var(--sub-text);">✕</button>
        <h3 style="margin:0 0 8px; font-size:0.95rem;">영상 설정</h3>
        <label style="display:block; font-size:0.82rem; color:var(--sub-text); margin:10px 0 4px;">제목</label>
        <input type="text" id="edit-video-title" style="width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--border-color); background:var(--panel-bg); color:var(--text-color); font-size:0.85rem;">
        <label style="display:block; font-size:0.82rem; color:var(--sub-text); margin:10px 0 4px;">썸네일 이미지 URL</label>
        <input type="url" id="edit-video-thumb" style="width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--border-color); background:var(--panel-bg); color:var(--text-color); font-size:0.85rem;">
        <label style="display:block; font-size:0.82rem; color:var(--sub-text); margin:10px 0 4px;">업로드 날짜</label>
        <input type="text" id="edit-video-date" disabled style="width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--border-color); background:var(--panel-bg); color:var(--text-color); font-size:0.85rem;">
        <button id="edit-video-save" style="margin-top:14px; background:var(--link-color); color:#fff; border:none; border-radius:8px; padding:9px 16px; font-size:0.85rem; font-weight:bold; cursor:pointer;">저장</button>
        <button id="edit-video-delete" style="margin-top:14px; margin-left:8px; background:#c0392b; color:#fff; border:none; border-radius:8px; padding:9px 16px; font-size:0.85rem; font-weight:bold; cursor:pointer;">영상 삭제</button>
        <div id="edit-video-msg" style="font-size:0.8rem; margin-top:8px;"></div>
    </div>
</div>

<script>
    document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light');
</script>

<script type="module">
    import {
        watchAuth, signInWithGoogle, getUserDoc,
        getSeries, getVideo, incrementVideoView, likeVideo, unlikeVideo,
        updateVideo, deleteVideoFromSeries, formatDate,
        getComments, getMyComment, upsertComment, deleteComment, likeComment, unlikeComment,
        canUploadToSeries, isSiteOwner
    } from './auth.js';

    const params = new URLSearchParams(location.search);
    const seriesId = params.get('s');
    const videoId = params.get('v');

    const watchMain = document.getElementById('watch-main');
    const commentsHeader = document.getElementById('comments-header');
    const commentFormWrap = document.getElementById('comment-form-wrap');
    const commentsList = document.getElementById('comments-list');

    let currentUser = null;
    let series = null;
    let video = null;
    let comments = [];
    let canManage = false;

    document.getElementById('back-btn').addEventListener('click', () => {
        if (document.referrer) history.back();
        else location.href = 'video.html';
    });

    let isPlaying = false;

    function getYoutubeEmbedUrl(url) {
        if (!url) return null;
        try {
            const u = new URL(url);
            let id = '';
            if (u.hostname.includes('youtu.be')) {
                id = u.pathname.slice(1);
            } else if (u.pathname.includes('/embed/')) {
                id = u.pathname.split('/embed/')[1];
            } else if (u.pathname.includes('/shorts/')) {
                id = u.pathname.split('/shorts/')[1];
            } else if (u.searchParams.get('v')) {
                id = u.searchParams.get('v');
            }
            id = (id || '').split('&')[0].split('?')[0].split('/')[0];
            return id ? `https://www.youtube.com/embed/${id}?autoplay=1` : null;
        } catch (e) {
            return null;
        }
    }

    function playVideo() {
        isPlaying = true;
        incrementVideoView(seriesId, videoId).catch(() => {});
        if (video) video.views = (video.views || 0) + 1;
        renderMain();
    }

    function renderMain() {
        if (!video) {
            watchMain.innerHTML = '<div class="empty-state">영상을 찾을 수 없습니다.</div>';
            return;
        }
        // 최초 렌더 시 뼈대(썸네일 영역 + 정보 영역)를 한 번만 만든다
        if (!document.getElementById('thumb-container')) {
            watchMain.innerHTML = `
                <div class="thumb-container" id="thumb-container"></div>
                <a class="series-row" href="series.html?id=${seriesId}">
                    <span class="mini-avatar">${series && series.thumbnail ? `<img src="${series.thumbnail}">` : (series ? series.name[0] : '?')}</span>
                    <span class="series-row-name">${series ? series.name : ''}</span>
                </a>
                <div class="watch-title" id="watch-title-el"></div>
                <div class="watch-stats" id="watch-stats-wrap"></div>
            `;
        }
        document.getElementById('watch-title-el').textContent = video.title;
        renderThumb();
        renderStats();
    }

    let lastThumbPlayingState = null;

    function renderThumb() {
        // 재생 상태가 바뀔 때만 썸네일/영상 영역을 다시 그린다 (재생 중엔 다시 그리면 영상이 처음부터 재시작되므로 건드리지 않음)
        if (lastThumbPlayingState === isPlaying) return;
        lastThumbPlayingState = isPlaying;

        const embedUrl = getYoutubeEmbedUrl(video.youtubeUrl);
        const thumbContainer = document.getElementById('thumb-container');
        const thumbInner = (isPlaying && embedUrl)
            ? `<iframe src="${embedUrl}" title="${video.title}" frameborder="0"
                 allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                 allowfullscreen style="width:100%; height:100%; display:block;"></iframe>`
            : `<img src="${video.thumbnailUrl}" alt="${video.title}">
               <div class="watch-btn">시청하기</div>`;
        thumbContainer.innerHTML = `${thumbInner}<button class="thumb-menu-btn" id="thumb-menu-btn">⋮</button>`;

        if (!isPlaying) {
            thumbContainer.addEventListener('click', (e) => {
                if (e.target.id === 'thumb-menu-btn') return;
                if (!embedUrl) {
                    // 임베드 주소를 못 만들면(지원하지 않는 링크 형식 등) 예전처럼 유튜브 새 탭으로 이동
                    if (video.youtubeUrl) window.open(video.youtubeUrl, '_blank', 'noopener');
                    incrementVideoView(seriesId, videoId).catch(() => {});
                    return;
                }
                playVideo();
            });
        }

        document.getElementById('thumb-menu-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            if (canManage) openEditVideoModal();
            // 일반 사용자는 눌러도 아무 동작 없음 (의도된 동작)
        });
    }

    function renderStats() {
        const isLiked = currentUser && (video.likes || []).includes(currentUser.uid);
        const statsWrap = document.getElementById('watch-stats-wrap');
        statsWrap.innerHTML = `
            <span class="stat-static">🔍 ${video.views || 0}</span>
            <button class="stat-btn ${isLiked ? 'liked' : ''}" id="like-btn">💗 ${(video.likes || []).length}</button>
        `;
        document.getElementById('like-btn').addEventListener('click', async () => {
            if (!currentUser) { try { await signInWithGoogle(); } catch (e) { return; } }
            const liked = (video.likes || []).includes(currentUser.uid);
            try {
                if (liked) {
                    await unlikeVideo(seriesId, videoId, currentUser.uid);
                    video.likes = (video.likes || []).filter(id => id !== currentUser.uid);
                } else {
                    await likeVideo(seriesId, videoId, currentUser.uid);
                    video.likes = [...(video.likes || []), currentUser.uid];
                }
                renderStats();
            } catch (e) {
                alert('오류: ' + e.message);
            }
        });
    }

    async function renderComments() {
        commentsHeader.innerHTML = `댓글 <span>${comments.length}개</span>`;
        if (comments.length === 0) {
            commentsList.innerHTML = '<div class="empty-state">아직 댓글이 없습니다.</div>';
        } else {
            commentsList.innerHTML = comments.map(c => {
                const liked = currentUser && (c.likes || []).includes(currentUser.uid);
                return `
                    <div class="comment-item">
                        <div class="comment-nickname">${c.authorName || '익명'}</div>
                        <div class="comment-text">${escapeHtml(c.text)}</div>
                        <button class="comment-like-btn ${liked ? 'liked' : ''}" data-comment="${c.id}">💗 ${(c.likes || []).length}</button>
                    </div>
                `;
            }).join('');
            commentsList.querySelectorAll('.comment-like-btn').forEach(btn => {
                btn.addEventListener('click', async () => {
                    if (!currentUser) { try { await signInWithGoogle(); } catch (e) { return; } }
                    const commentUid = btn.dataset.comment;
                    const c = comments.find(x => x.id === commentUid);
                    if (!c) return;
                    const liked = (c.likes || []).includes(currentUser.uid);
                    try {
                        if (liked) {
                            await unlikeComment(seriesId, videoId, commentUid, currentUser.uid);
                            c.likes = (c.likes || []).filter(id => id !== currentUser.uid);
                        } else {
                            await likeComment(seriesId, videoId, commentUid, currentUser.uid);
                            c.likes = [...(c.likes || []), currentUser.uid];
                        }
                        renderComments();
                    } catch (e) {
                        alert('오류: ' + e.message);
                    }
                });
            });
        }
        renderCommentForm();
    }

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str || '';
        return div.innerHTML;
    }

    async function renderCommentForm() {
        if (!currentUser) {
            commentFormWrap.innerHTML = '<div class="comment-hint">로그인하면 댓글을 작성할 수 있습니다.</div>';
            return;
        }
        let mine = null;
        try { mine = await getMyComment(seriesId, videoId, currentUser.uid); } catch (e) { console.error(e); }
        commentFormWrap.innerHTML = `
            <div class="comment-form">
                <textarea id="comment-text-input" placeholder="댓글은 계정당 1개만 남길 수 있어요.">${mine ? mine.text : ''}</textarea>
                <div class="comment-form-actions">
                    <button class="save-btn" id="comment-save-btn">${mine ? '수정' : '댓글 작성'}</button>
                    ${mine ? '<button class="delete-btn" id="comment-delete-btn">삭제</button>' : ''}
                </div>
            </div>
        `;
        document.getElementById('comment-save-btn').addEventListener('click', async () => {
            const text = document.getElementById('comment-text-input').value.trim();
            if (!text) { alert('댓글 내용을 입력해주세요.'); return; }
            try {
                await upsertComment(seriesId, videoId, currentUser.uid, {
                    authorName: currentUser.displayName || currentUser.email,
                    authorPhoto: currentUser.photoURL || '',
                    text,
                });
                comments = await getComments(seriesId, videoId);
                renderComments();
            } catch (e) {
                alert('오류: ' + e.message);
            }
        });
        const delBtn = document.getElementById('comment-delete-btn');
        if (delBtn) {
            delBtn.addEventListener('click', async () => {
                if (!confirm('댓글을 삭제할까요?')) return;
                try {
                    await deleteComment(seriesId, videoId, currentUser.uid);
                    comments = await getComments(seriesId, videoId);
                    renderComments();
                } catch (e) {
                    alert('오류: ' + e.message);
                }
            });
        }
    }

    function openEditVideoModal() {
        document.getElementById('edit-video-title').value = video.title || '';
        document.getElementById('edit-video-thumb').value = video.thumbnailUrl || '';
        document.getElementById('edit-video-date').value = formatDate(video.createdAt) || '알 수 없음';
        document.getElementById('edit-video-msg').textContent = '';
        document.getElementById('edit-video-modal').style.display = 'flex';
    }
    document.getElementById('edit-video-close').addEventListener('click', () => {
        document.getElementById('edit-video-modal').style.display = 'none';
    });
    document.getElementById('edit-video-modal').addEventListener('click', (e) => {
        if (e.target.id === 'edit-video-modal') document.getElementById('edit-video-modal').style.display = 'none';
    });
    document.getElementById('edit-video-save').addEventListener('click', async () => {
        const title = document.getElementById('edit-video-title').value.trim();
        const thumbnailUrl = document.getElementById('edit-video-thumb').value.trim();
        const msg = document.getElementById('edit-video-msg');
        if (!title || !thumbnailUrl) { msg.textContent = '제목과 썸네일 URL을 입력해주세요.'; msg.style.color = '#c0392b'; return; }
        try {
            await updateVideo(seriesId, videoId, { title, thumbnailUrl });
        } catch (e) {
            msg.textContent = '오류: ' + e.message; msg.style.color = '#c0392b';
            return;
        }
        msg.textContent = '저장되었습니다!'; msg.style.color = '#1a7f37';
        video.title = title;
        video.thumbnailUrl = thumbnailUrl;
        if (!isPlaying) lastThumbPlayingState = null; // 재생 중이 아닐 때만 썸네일 영역을 강제로 다시 그림
        renderMain();
    });
    document.getElementById('edit-video-delete').addEventListener('click', async () => {
        if (!confirm('이 영상을 삭제할까요? 되돌릴 수 없습니다.')) return;
        try {
            await deleteVideoFromSeries(seriesId, videoId);
            location.href = `series.html?id=${seriesId}`;
        } catch (e) {
            document.getElementById('edit-video-msg').textContent = '오류: ' + e.message;
            document.getElementById('edit-video-msg').style.color = '#c0392b';
        }
    });

    async function init() {
        if (!seriesId || !videoId) {
            watchMain.innerHTML = '<div class="empty-state">잘못된 접근입니다.</div>';
            return;
        }
        try {
            [series, video] = await Promise.all([getSeries(seriesId), getVideo(seriesId, videoId)]);
            comments = await getComments(seriesId, videoId);
        } catch (e) {
            console.error(e);
            watchMain.innerHTML = '<div class="empty-state">불러오지 못했습니다.</div>';
            return;
        }
        renderMain();
        renderComments();
    }

    watchAuth(async (user) => {
        currentUser = user;
        canManage = !!user && series && (isSiteOwner(user.email) || canUploadToSeries(series, user.email));
        renderMain();
        renderCommentForm();
    });

    init();
</script>
</body>
</html>
