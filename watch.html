<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영상 - HYUNIL VIDEO</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="watch.css">
</head>
<body>
<div class="top-bar">
<div class="top-bar-left">
<button class="back-btn" id="back-btn" title="뒤로가기">
<svg fill="none" height="22" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="22"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>
</button>
<a class="video-badge-link" href="video.html" title="HYUNIL VIDEO 홈으로 가기"><img src="hyunil_video_badge.png" alt="HYUNIL VIDEO" class="video-badge-img"></a>
</div>
<div class="top-bar-right">
<button class="login-btn" id="login-btn">로그인</button>
<div class="user-area" id="user-area">
<button class="profile-btn" id="profile-btn">
<img id="user-photo" src="" alt="프로필">
<span id="user-name"></span>
</button>
<button class="logout-btn" id="logout-btn">로그아웃</button>
</div>
</div>
</div>
<div class="watch-layout">
<div class="watch-main" id="watch-main">
<div class="empty-state">불러오는 중...</div>
</div>
<div class="reco-row">
<div class="reco-panel">
<h3 class="reco-header">추천영상</h3>
<div class="reco-list" id="reco-list"></div>
</div>
<button class="reco-drawer-toggle" id="reco-drawer-toggle" aria-label="댓글 열기">›</button>
</div>
<aside class="watch-side" id="watch-side">
<button class="drawer-handle" id="drawer-handle" aria-label="댓글 닫기">‹</button>
<button class="drawer-close-btn" id="drawer-close-btn">✕</button>
<div class="comments-header" id="comments-header">댓글</div>
<div id="comment-form-wrap"></div>
<div id="comments-list"><div class="empty-state">불러오는 중...</div></div>
</aside>
</div>
<div class="drawer-overlay" id="drawer-overlay"></div>
<div id="edit-video-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index:2000; align-items:center; justify-content:center;">
<div style="background: var(--surface-container-low, #1c1b1b); border: 1px solid var(--surface-stroke, #222); color: var(--on-surface, #e5e2e1); width: 92%; max-width: 420px; max-height: 85vh; overflow-y:auto; border-radius:16px; padding:24px; position:relative;">
<button class="" id="edit-video-close" style="position:absolute; top:16px; right:16px; background:none; border:none; font-size:20px; cursor:pointer; color:var(--tertiary, #c7c6c6);">✕</button>
<h3 class="" style="margin:0 0 16px; font-size:1.1rem; font-weight:600;">영상 설정</h3>
<label class="" style="display:block; font-size:0.85rem; color:var(--tertiary, #c7c6c6); margin:12px 0 6px;">제목</label>
<input id="edit-video-title" style="width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--surface-stroke, #222); background:var(--surface-container-lowest, #0e0e0e); color:var(--on-surface, #e5e2e1); font-size:0.9rem; outline:none;" type="text">
<label class="" style="display:block; font-size:0.85rem; color:var(--tertiary, #c7c6c6); margin:16px 0 6px;">썸네일 이미지 URL</label>
<input id="edit-video-thumb" style="width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--surface-stroke, #222); background:var(--surface-container-lowest, #0e0e0e); color:var(--on-surface, #e5e2e1); font-size:0.9rem; outline:none;" type="url">
<label class="" style="display:block; font-size:0.85rem; color:var(--tertiary, #c7c6c6); margin:16px 0 6px;">업로드 날짜</label>
<input disabled="" id="edit-video-date" style="width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--surface-stroke, #222); background:var(--surface-container-lowest, #0e0e0e); color:var(--tertiary, #c7c6c6); font-size:0.9rem; opacity:0.7;" type="text">
<div style="display:flex; gap:8px; margin-top:24px;">
<button class="" id="edit-video-save" style="flex:1; background:var(--inverse-on-surface, #313030); color:#fff; border:none; border-radius:8px; padding:10px 16px; font-size:0.9rem; font-weight:bold; cursor:pointer;">저장</button>
<button class="" id="edit-video-delete" style="flex:1; background:var(--error-container, #93000a); color:#fff; border:none; border-radius:8px; padding:10px 16px; font-size:0.9rem; font-weight:bold; cursor:pointer;">영상 삭제</button>
</div>
<div id="edit-video-msg" style="font-size:0.85rem; margin-top:12px; text-align:center;"></div>
</div>
</div>
<script type="module">
    // ============================================================
    // watch.html 스크립트
    // URL의 ?s=시리즈ID&v=영상ID 를 읽어서 해당 영상 정보를 불러오고,
    // 재생/좋아요/댓글/추천영상/로그인 처리를 담당한다.
    // 스타일은 watch.css 에 분리되어 있음.
    // ============================================================
    import {
        watchAuth, signInWithGoogle, signOutUser, getUserDoc,
        getSeries, getVideo, incrementVideoView, likeVideo, unlikeVideo,
        updateVideo, deleteVideoFromSeries, formatDate,
        getComments, getMyComment, upsertComment, deleteComment, likeComment, unlikeComment,
        canUploadToSeries, isSiteOwner, createDummyComment,
        getRandomRecommendedVideos, getAllSeries
    } from './auth.js';

    // 현재 페이지가 어떤 시리즈의 어떤 영상인지는 URL 쿼리스트링으로 전달됨
    // 예: watch.html?s=시리즈ID&v=영상ID
    const params = new URLSearchParams(location.search);
    const seriesId = params.get('s');
    const videoId = params.get('v');

    // ----- 자주 쓰는 DOM 요소 미리 찾아두기 -----
    const watchMain = document.getElementById('watch-main');
    const commentsHeader = document.getElementById('comments-header');
    const commentFormWrap = document.getElementById('comment-form-wrap');
    const commentsList = document.getElementById('comments-list');
    const recoList = document.getElementById('reco-list');
    const watchSide = document.getElementById('watch-side'); // 댓글 패널(데스크톱) / 댓글 드로어(모바일)
    const loginBtn = document.getElementById('login-btn');
    const userArea = document.getElementById('user-area');
    const userPhoto = document.getElementById('user-photo');
    const userName = document.getElementById('user-name');
    const logoutBtn = document.getElementById('logout-btn');
    const drawerOverlay = document.getElementById('drawer-overlay');
    const drawerCloseBtn = document.getElementById('drawer-close-btn');
    const drawerHandle = document.getElementById('drawer-handle');
    const recoDrawerToggle = document.getElementById('reco-drawer-toggle');

    // ----- 모바일 전용: 댓글 드로어 열기/닫기 -----
    // (데스크톱에서는 .watch-side가 position:static 고정 패널이라 이 함수들이 사실상 아무 영향 없음)
    function openCommentsDrawer() { watchSide.classList.add('open'); drawerOverlay.classList.add('open'); }
    function closeCommentsDrawer() { watchSide.classList.remove('open'); drawerOverlay.classList.remove('open'); }
    recoDrawerToggle.addEventListener('click', openCommentsDrawer); // 추천영상 옆 ">" 버튼
    drawerHandle.addEventListener('click', closeCommentsDrawer);    // 드로어 옆구리 손잡이
    drawerCloseBtn.addEventListener('click', closeCommentsDrawer);  // 드로어 안 "✕" 버튼
    drawerOverlay.addEventListener('click', closeCommentsDrawer);   // 뒤쪽 어두운 배경 클릭 시에도 닫힘

    // ----- 로그인 / 로그아웃 버튼 -----
    loginBtn.addEventListener('click', async () => {
        try { await signInWithGoogle(); }
        catch (err) { alert('로그인에 실패했습니다: ' + err.message); }
    });
    logoutBtn.addEventListener('click', () => signOutUser());

    // 추천영상 목록을 불러와서 왼쪽 패널에 렌더링.
    // 전체 영상 중 무작위로 16개를 뽑은 뒤, 지금 보고 있는 영상 자신은 제외하고 최대 12개만 사용.
    async function renderRecommended() {
        try {
            const seriesList = await getAllSeries();
            const seriesCache = {}; // 시리즈 id -> 시리즈 정보 (썸네일 카드에 시리즈명 표시용)
            seriesList.forEach(s => seriesCache[s.id] = s);
            const vids = (await getRandomRecommendedVideos(16))
                .filter(v => !(v.seriesId === seriesId && v.id === videoId)) // 지금 보고 있는 영상은 추천에서 제외
                .slice(0, 12);
            if (vids.length === 0) {
                recoList.innerHTML = '<div class="empty-state">추천할 영상이 없습니다.</div>';
                return;
            }
            // 썸네일이 위, 제목/시리즈명이 아래에 오는 카드 형태로 렌더링
            recoList.innerHTML = vids.map(v => {
                const s = seriesCache[v.seriesId];
                return `
                    <a class="reco-item" href="watch.html?s=${v.seriesId}&v=${v.id}">
                        <div class="reco-thumb"><img src="${v.thumbnailUrl}" alt="${v.title}"></div>
                        <div class="reco-info">
                            <div class="reco-title">${v.title}</div>
                            <div class="reco-series">${s ? s.name : '알 수 없는 시리즈'}</div>
                        </div>
                    </a>
                `;
            }).join('');
        } catch (e) {
            console.error(e);
            recoList.innerHTML = '<div class="empty-state">불러오지 못했습니다.</div>';
        }
    }

    let currentUser = null;
    let series = null;
    // ----- 페이지 전역 상태 -----
    let video = null;      // 현재 보고 있는 영상 문서
    let comments = [];     // 이 영상의 댓글 목록
    let canManage = false; // 로그인한 사용자가 이 영상을 수정/삭제할 권한이 있는지

    document.getElementById('back-btn').addEventListener('click', () => {
        if (document.referrer) history.back();
        else location.href = 'video.html';
    });

    let isPlaying = false; // true면 썸네일 대신 유튜브 iframe이 재생 중인 상태

    // 유튜브 URL의 다양한 형식(youtu.be, /embed/, /shorts/, ?v=)에서
    // 영상 ID만 뽑아내서 자동재생 embed URL로 변환한다. 파싱 실패 시 null 반환.
    function getYoutubeEmbedUrl(url) {
        if (!url) return null;
        try {
            const u = new URL(url);
            let id = '';
            if (u.hostname.includes('youtu.be')) {
                id = u.pathname.slice(1);
            } else if (u.pathname.includes('/embed/')) {
                id = u.pathname.split('/embed/')[1];
            } else if (u.pathname.includes('/shorts/')) {
                id = u.pathname.split('/shorts/')[1];
            } else if (u.searchParams.get('v')) {
                id = u.searchParams.get('v');
            }
            id = (id || '').split('&')[0].split('?')[0].split('/')[0];
            return id ? `https://www.youtube.com/embed/${id}?autoplay=1` : null;
        } catch (e) {
            return null;
        }
    }

    // 썸네일을 클릭했을 때 실제 재생으로 전환
    function playVideo() {
        isPlaying = true;
        incrementVideoView(seriesId, videoId).catch(() => {}); // 조회수 +1 (실패해도 재생은 계속)
        if (video) video.views = (video.views || 0) + 1; // 서버 응답을 기다리지 않고 화면 숫자를 바로 올려줌
        renderMain();
    }

    // 영상 정보 영역(썸네일/제목/시리즈/통계) 전체를 그린다.
    function renderMain() {
        if (!video) {
            watchMain.innerHTML = '<div class="empty-state">영상을 찾을 수 없습니다.</div>';
            return;
        }
        // 최초 렌더 시 뼈대(썸네일 영역 + 정보 영역)를 한 번만 만든다
        if (!document.getElementById('thumb-container')) {
            watchMain.innerHTML = `
                <div class="thumb-container" id="thumb-container"></div>
                <a class="series-row" href="series.html?id=${seriesId}">
                    <span class="mini-avatar">${series && series.thumbnail ? `<img src="${series.thumbnail}">` : (series ? series.name[0] : '?')}</span>
                    <span class="series-row-name">${series ? series.name : ''}</span>
                </a>
                <div class="watch-title" id="watch-title-el"></div>
                <div class="watch-stats" id="watch-stats-wrap"></div>
            `;
        }
        document.getElementById('watch-title-el').textContent = video.title;
        renderThumb();
        renderStats();
    }

    let lastThumbPlayingState = null;

    // 썸네일 이미지 <-> 유튜브 iframe 을 전환해서 그린다.
    function renderThumb() {
        // 재생 상태가 바뀔 때만 썸네일/영상 영역을 다시 그린다 (재생 중엔 다시 그리면 영상이 처음부터 재시작되므로 건드리지 않음)
        if (lastThumbPlayingState === isPlaying) return;
        lastThumbPlayingState = isPlaying;

        const embedUrl = getYoutubeEmbedUrl(video.youtubeUrl);
        const thumbContainer = document.getElementById('thumb-container');
        const thumbInner = (isPlaying && embedUrl)
            ? `<iframe src="${embedUrl}" title="${video.title}" frameborder="0"
                 allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                 allowfullscreen style="width:100%; height:100%; display:block;"></iframe>`
            : `<img src="${video.thumbnailUrl}" alt="${video.title}">
               <div class="watch-btn">시청하기</div>`;
        thumbContainer.innerHTML = `${thumbInner}<button class="thumb-menu-btn" id="thumb-menu-btn">⋮</button>`;

        if (!isPlaying) {
            // 재생 전(썸네일 상태)에는 영역 전체를 눌러도 재생되도록
            thumbContainer.addEventListener('click', (e) => {
                if (e.target.id === 'thumb-menu-btn') return; // ⋮ 메뉴 버튼 클릭은 재생과 별개로 처리
                if (!embedUrl) {
                    // 임베드 주소를 못 만들면(지원하지 않는 링크 형식 등) 예전처럼 유튜브 새 탭으로 이동
                    if (video.youtubeUrl) window.open(video.youtubeUrl, '_blank', 'noopener');
                    incrementVideoView(seriesId, videoId).catch(() => {});
                    return;
                }
                playVideo();
            });
        }

        // 썸네일 우하단 ⋮ 버튼: 관리 권한자만 영상 수정 모달을 열 수 있음
        document.getElementById('thumb-menu-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            if (canManage) openEditVideoModal();
            // 일반 사용자는 눌러도 아무 동작 없음 (의도된 동작)
        });
    }

    // 조회수 + 좋아요 버튼 영역을 그린다.
    function renderStats() {
        const isLiked = currentUser && (video.likes || []).includes(currentUser.uid);
        const statsWrap = document.getElementById('watch-stats-wrap');
        statsWrap.innerHTML = `
            <span class="stat-static">조회수 ${video.views || 0}</span>
            <button class="stat-btn ${isLiked ? 'liked' : ''}" id="like-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="${isLiked ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                ${(video.likes || []).length}
            </button>
        `;
        document.getElementById('like-btn').addEventListener('click', async () => {
            if (!currentUser) { try { await signInWithGoogle(); } catch (e) { return; } } // 비로그인이면 먼저 로그인 유도
            const liked = (video.likes || []).includes(currentUser.uid);
            try {
                if (liked) {
                    await unlikeVideo(seriesId, videoId, currentUser.uid);
                    video.likes = (video.likes || []).filter(id => id !== currentUser.uid);
                } else {
                    await likeVideo(seriesId, videoId, currentUser.uid);
                    video.likes = [...(video.likes || []), currentUser.uid];
                }
                renderStats(); // 서버 응답 반영해서 다시 그림
            } catch (e) {
                alert('오류: ' + e.message);
            }
        });
    }

    // 댓글 목록 + 개수를 그린다. (댓글은 계정당 1개만 작성 가능한 구조)
    async function renderComments() {
        commentsHeader.innerHTML = `댓글 <span>${comments.length}</span>`;
        if (comments.length === 0) {
            commentsList.innerHTML = '<div class="empty-state">아직 댓글이 없습니다.</div>';
        } else {
            commentsList.innerHTML = comments.map(c => {
                const liked = currentUser && (c.likes || []).includes(currentUser.uid);
                return `
                    <div class="comment-item">
                        <div class="comment-nickname">${c.authorName || '익명'}</div>
                        <div class="comment-text">${escapeHtml(c.text)}</div>
                        <button class="comment-like-btn ${liked ? 'liked' : ''}" data-comment="${c.id}">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="${liked ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                            ${(c.likes || []).length}
                        </button>
                    </div>
                `;
            }).join('');
            commentsList.querySelectorAll('.comment-like-btn').forEach(btn => {
                btn.addEventListener('click', async () => {
                    if (!currentUser) { try { await signInWithGoogle(); } catch (e) { return; } }
                    const commentUid = btn.dataset.comment;
                    const c = comments.find(x => x.id === commentUid);
                    if (!c) return;
                    const liked = (c.likes || []).includes(currentUser.uid);
                    try {
                        if (liked) {
                            await unlikeComment(seriesId, videoId, commentUid, currentUser.uid);
                            c.likes = (c.likes || []).filter(id => id !== currentUser.uid);
                        } else {
                            await likeComment(seriesId, videoId, commentUid, currentUser.uid);
                            c.likes = [...(c.likes || []), currentUser.uid];
                        }
                        renderComments();
                    } catch (e) {
                        alert('오류: ' + e.message);
                    }
                });
            });
        }
        renderCommentForm();
    }

    // 사용자가 입력한 댓글 텍스트를 안전하게 화면에 표시하기 위한 escape
    // (innerHTML로 그대로 넣으면 <script> 등이 실행될 수 있으므로 textContent를 거쳐 변환)
    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str || '';
        return div.innerHTML;
    }

    // 댓글 작성/수정 폼을 그린다. (비로그인 시 안내문구만, 로그인 시 본인 댓글 유무에 따라 "작성"/"수정" 버튼)
    async function renderCommentForm() {
        if (!currentUser) {
            commentFormWrap.innerHTML = '<div class="comment-hint">로그인하면 댓글을 작성할 수 있습니다.</div>';
            return;
        }
        let mine = null;
        try { mine = await getMyComment(seriesId, videoId, currentUser.uid); } catch (e) { console.error(e); }
        const isAdminUser = isSiteOwner(currentUser.email); // 관리자만 "더미 댓글 추가/삭제" 버튼을 볼 수 있음
        commentFormWrap.innerHTML = `
            <div class="comment-form">
                <textarea id="comment-text-input" placeholder="댓글은 계정당 1개만 남길 수 있어요.">${mine ? mine.text : ''}</textarea>
                <div class="comment-form-actions">
                    ${mine ? '<button class="delete-btn" id="comment-delete-btn">삭제</button>' : ''}
                    <button class="save-btn" id="comment-save-btn">${mine ? '수정' : '작성'}</button>
                    ${isAdminUser ? '<button class="save-btn" id="admin-add-dummy-comment-btn" type="button">더미 댓글 추가</button>' : ''}
                    ${isAdminUser ? '<button class="delete-btn" id="admin-delete-dummy-comment-btn" type="button">더미 댓글 삭제</button>' : ''}
                </div>
                ${isAdminUser ? `
                <div id="admin-dummy-comment-select-wrap" class="admin-select-wrap" style="display:none;">
                    <div class="admin-select-all-row">
                        <label class="admin-select-all-label">
                            <input type="checkbox" id="admin-dummy-comment-select-all">
                            <span>전체 선택</span>
                        </label>
                        <div class="admin-select-actions">
                            <button class="delete-btn" id="admin-dummy-comment-delete-selected-btn" type="button">선택 삭제</button>
                            <button class="save-btn" id="admin-dummy-comment-select-cancel-btn" type="button">취소</button>
                        </div>
                    </div>
                    <div id="admin-dummy-comment-checklist" class="admin-checklist"></div>
                </div>` : ''}
            </div>
        `;
        document.getElementById('comment-save-btn').addEventListener('click', async () => {
            const text = document.getElementById('comment-text-input').value.trim();
            if (!text) { alert('댓글 내용을 입력해주세요.'); return; }
            try {
                // upsert: 이미 내 댓글이 있으면 수정, 없으면 새로 작성 (계정당 1개 제한)
                await upsertComment(seriesId, videoId, currentUser.uid, {
                    authorName: currentUser.displayName || currentUser.email,
                    authorPhoto: currentUser.photoURL || '',
                    text,
                });
                comments = await getComments(seriesId, videoId); // 최신 목록 다시 불러오기
                renderComments();
            } catch (e) {
                alert('오류: ' + e.message);
            }
        });
        // 관리자 전용: 댓글 작성 옆 "더미 댓글 추가" (내용 없이 형식상으로만 존재하는 댓글을 계정 제한과 무관하게 추가)
        const dummyCommentBtn = document.getElementById('admin-add-dummy-comment-btn');
        if (dummyCommentBtn) {
            dummyCommentBtn.addEventListener('click', async () => {
                try {
                    await createDummyComment(seriesId, videoId);
                    comments = await getComments(seriesId, videoId);
                    renderComments(); // 목록 갱신 + renderCommentForm() 재호출까지 함께 처리됨
                } catch (e) {
                    alert('오류: ' + e.message);
                }
            });
        }
        // 관리자 전용: "더미 댓글 삭제" - 누르면 이 영상의 더미 댓글을 체크박스로 선택해서 지울 수 있는 패널이 열림
        const dummyDeleteToggleBtn = document.getElementById('admin-delete-dummy-comment-btn');
        const dummyCommentSelectWrap = document.getElementById('admin-dummy-comment-select-wrap');
        if (dummyDeleteToggleBtn) {
            dummyDeleteToggleBtn.addEventListener('click', () => {
                const isOpen = dummyCommentSelectWrap.style.display !== 'none';
                if (isOpen) { dummyCommentSelectWrap.style.display = 'none'; return; }
                dummyCommentSelectWrap.style.display = 'block';
                renderDummyCommentChecklist();
            });
        }
        function renderDummyCommentChecklist() {
            const listEl = document.getElementById('admin-dummy-comment-checklist');
            const selectAllCb = document.getElementById('admin-dummy-comment-select-all');
            selectAllCb.checked = false;
            const dummyComments = comments.filter(c => c.isDummy);
            if (dummyComments.length === 0) {
                listEl.innerHTML = '<div class="empty-state">더미 댓글이 없습니다.</div>';
                return;
            }
            listEl.innerHTML = dummyComments.map(c => `
                <label class="admin-check-row">
                    <input type="checkbox" class="admin-dummy-comment-check" data-comment="${c.id}">
                    <span>${escapeHtml(c.text)}</span>
                </label>
            `).join('');
        }
        const selectAllCommentCb = document.getElementById('admin-dummy-comment-select-all');
        if (selectAllCommentCb) {
            selectAllCommentCb.addEventListener('change', (e) => {
                document.querySelectorAll('.admin-dummy-comment-check').forEach(cb => cb.checked = e.target.checked);
            });
        }
        const cancelCommentSelectBtn = document.getElementById('admin-dummy-comment-select-cancel-btn');
        if (cancelCommentSelectBtn) {
            cancelCommentSelectBtn.addEventListener('click', () => {
                dummyCommentSelectWrap.style.display = 'none';
            });
        }
        const deleteSelectedCommentBtn = document.getElementById('admin-dummy-comment-delete-selected-btn');
        if (deleteSelectedCommentBtn) {
            deleteSelectedCommentBtn.addEventListener('click', async () => {
                const checked = Array.from(document.querySelectorAll('.admin-dummy-comment-check:checked'));
                if (checked.length === 0) { alert('삭제할 더미 댓글을 선택해주세요.'); return; }
                if (!confirm(`선택한 더미 댓글 ${checked.length}개를 삭제할까요?`)) return;
                try {
                    await Promise.all(checked.map(cb => deleteComment(seriesId, videoId, cb.dataset.comment)));
                    comments = await getComments(seriesId, videoId);
                    renderComments(); // 목록 갱신 + renderCommentForm() 재호출까지 함께 처리됨 (패널은 다시 접힘)
                } catch (e) {
                    alert('오류: ' + e.message);
                }
            });
        }
        const delBtn = document.getElementById('comment-delete-btn');
        if (delBtn) {
            delBtn.addEventListener('click', async () => {
                if (!confirm('댓글을 삭제할까요?')) return;
                try {
                    await deleteComment(seriesId, videoId, currentUser.uid);
                    comments = await getComments(seriesId, videoId);
                    renderComments();
                } catch (e) {
                    alert('오류: ' + e.message);
                }
            });
        }
    }

    // ----- 영상 수정 모달 (canManage === true 인 사용자만 열 수 있음) -----
    function openEditVideoModal() {
        document.getElementById('edit-video-title').value = video.title || '';
        document.getElementById('edit-video-thumb').value = video.thumbnailUrl || '';
        document.getElementById('edit-video-date').value = formatDate(video.createdAt) || '알 수 없음';
        document.getElementById('edit-video-msg').textContent = '';
        document.getElementById('edit-video-modal').style.display = 'flex';
    }
    document.getElementById('edit-video-close').addEventListener('click', () => {
        document.getElementById('edit-video-modal').style.display = 'none';
    });
    document.getElementById('edit-video-modal').addEventListener('click', (e) => {
        if (e.target.id === 'edit-video-modal') document.getElementById('edit-video-modal').style.display = 'none';
    });
    document.getElementById('edit-video-save').addEventListener('click', async () => {
        const title = document.getElementById('edit-video-title').value.trim();
        const thumbnailUrl = document.getElementById('edit-video-thumb').value.trim();
        const msg = document.getElementById('edit-video-msg');
        if (!title || !thumbnailUrl) { msg.textContent = '제목과 썸네일 URL을 입력해주세요.'; msg.style.color = 'var(--error)'; return; }
        try {
            await updateVideo(seriesId, videoId, { title, thumbnailUrl });
        } catch (e) {
            msg.textContent = '오류: ' + e.message; msg.style.color = 'var(--error)';
            return;
        }
        msg.textContent = '저장되었습니다!'; msg.style.color = '#4ade80';
        video.title = title;
        video.thumbnailUrl = thumbnailUrl;
        if (!isPlaying) lastThumbPlayingState = null; // 재생 중이 아닐 때만 썸네일 영역을 강제로 다시 그림
        renderMain();
    });
    document.getElementById('edit-video-delete').addEventListener('click', async () => {
        if (!confirm('이 영상을 삭제할까요? 되돌릴 수 없습니다.')) return;
        try {
            await deleteVideoFromSeries(seriesId, videoId);
            location.href = `series.html?id=${seriesId}`;
        } catch (e) {
            document.getElementById('edit-video-msg').textContent = '오류: ' + e.message;
            document.getElementById('edit-video-msg').style.color = 'var(--error)';
        }
    });

    // 초기 데이터 로딩: 시리즈 + 영상 정보 + 댓글을 병렬로 가져온 뒤 화면을 그린다.
    async function init() {
        if (!seriesId || !videoId) {
            watchMain.innerHTML = '<div class="empty-state">잘못된 접근입니다.</div>';
            return;
        }
        try {
            [series, video] = await Promise.all([getSeries(seriesId), getVideo(seriesId, videoId)]);
            comments = await getComments(seriesId, videoId);
        } catch (e) {
            console.error(e);
            watchMain.innerHTML = '<div class="empty-state">불러오지 못했습니다.</div>';
            return;
        }
        renderMain();
        renderComments();
        renderRecommended();
    }

    // 로그인 상태가 바뀔 때마다(최초 진입 포함) 호출됨.
    // 로그인 여부에 따라 상단바의 로그인 버튼 <-> 사용자 정보 영역을 토글하고,
    // 관리 권한(canManage) 계산 + 좋아요/댓글 버튼 상태를 다시 그린다.
    watchAuth(async (user) => {
        currentUser = user;
        canManage = !!user && series && (isSiteOwner(user.email) || canUploadToSeries(series, user.email));
        if (user) {
            loginBtn.style.display = 'none';
            userArea.style.display = 'flex';
            userPhoto.src = user.photoURL || '';
            userName.textContent = user.displayName || user.email;
        } else {
            loginBtn.style.display = 'inline-block';
            userArea.style.display = 'none';
        }
        renderMain();
        renderCommentForm();
    });

    init(); // 페이지 로드 시 즉시 실행
</script>
</body></html>
